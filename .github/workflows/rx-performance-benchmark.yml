name: RX Performance Benchmark
on:
  push:
    branches: [main]
    paths:
      - 'rx-math-core.cjs'
      - 'rx-math-core-test.cjs'
      - 'rx-neural-core.cjs'
      - 'rx-performance-benchmark.cjs'
      - 'rx-neural-core-test.cjs'
      - '.github/workflows/rx-performance-benchmark.yml'
  pull_request:
    paths:
      - 'rx-performance-benchmark.cjs'
      - 'rx-math-core.cjs'
      - 'rx-math-core-test.cjs'
      - 'rx-neural-core.cjs'
      - 'rx-neural-core-test.cjs'
      - 'rx-fast-test-engine.cjs'
      - 'rx-bibi-dashboard-summary.cjs'
      - 'guard/rx-developer-core.cjs'
      - 'rx-ant-task-board.cjs'
      - 'rx-queen-developer-queue.cjs'
      - '.github/workflows/rx-performance-benchmark.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and measure RX MATH CORE
        run: node rx-math-core-test.cjs
      - name: Verify RX NEURAL CORE learning
        run: node rx-neural-core-test.cjs
      - name: Verify RX Neural adaptive mode and fallback
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {createNetwork,predictAdaptive,predictBatch}=require('./rx-neural-core.cjs');
          const net=createNetwork(3,6,2);
          for(const count of [1,8,64]){
            const input=Float32Array.from({length:count*3},(_,i)=>Math.sin(i));
            const fast=predictAdaptive(net,input);
            const fallback=predictAdaptive(net,input,{preferBatch:false});
            const direct=predictBatch(net,input);
            assert.equal(fast.method,'batch');
            assert.equal(fallback.method,'sequential');
            for(let i=0;i<direct.length;i++){
              assert.ok(Math.abs(fast.predictions[i]-direct[i])<1e-5);
              assert.ok(Math.abs(fallback.predictions[i]-direct[i])<1e-5);
            }
          }
          assert.throws(()=>predictAdaptive(net,new Float32Array([1,2])));
          assert.throws(()=>predictAdaptive(net,new Float32Array([1,2,3]),{preferBatch:'yes'}));
          console.log('RX Neural adaptive/fallback: PASS');
          NODE
      - name: Verify calibrated RX Neural selector
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {createNetwork,createAutoPredictor,predictBatch}=require('./rx-neural-core.cjs');
          const net=createNetwork(4,8,3);
          const auto=createAutoPredictor(net,{samples:16,rounds:5});
          assert.ok(['batch','sequential'].includes(auto.method));
          const input=Float32Array.from({length:32*4},(_,i)=>Math.sin(i));
          const reference=predictBatch(net,input);
          for(const result of [auto.predict(input),auto.fallback(input)]){
            assert.equal(result.predictions.length,reference.length);
            for(let i=0;i<reference.length;i++)assert.ok(Math.abs(result.predictions[i]-reference[i])<1e-4);
          }
          assert.equal(auto.fallback(input).method,'sequential');
          assert.throws(()=>createAutoPredictor(net,{samples:5000}));
          console.log('RX Neural auto selector: PASS; selected',auto.method);
          NODE
      - name: Measure RX modules
        run: node rx-performance-benchmark.cjs
      - name: Compare RX FAST full and Queen-selected test duration
        run: |
          node - <<'NODE'
          const {runFastTests,selectFastTests}=require('./rx-fast-test-engine.cjs');
          (async()=>{
            const full=await runFastTests();
            const selected=await runFastTests({tests:selectFastTests(['rx-mega-cloud-computer.cjs'])});
            const summary=[
              '## RX FAST — measured comparison',
              '| Mode | Tests | Passed | Duration |',
              '|---|---:|---:|---:|',
              '| Full | '+full.total+' | '+full.passed+' | '+full.elapsedMs+' ms |',
              '| Queen-selected | '+selected.total+' | '+selected.passed+' | '+selected.elapsedMs+' ms |',
              '',
              'These are two different test sets, not equivalent coverage.'
            ].join('\\n');
            console.log(summary);
            require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\\n');
            if(full.failed||selected.failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Verify RX FAST selection before timing
        run: node tests/rx-fast-test-selection.cjs
      - name: Repeat RX FAST Queen timing (5 samples)
        run: |
          node - <<'NODE'
          const {runFastTests,selectFastTests}=require('./rx-fast-test-engine.cjs');
          (async()=>{
            const tests=selectFastTests(['rx-mega-cloud-computer.cjs']);
            const samples=[];
            const details=[];
            for(let i=0;i<5;i++){
              const report=await runFastTests({tests});
              if(report.failed)throw Error('RX Queen isolated test failed in sample '+(i+1));
              samples.push(report.elapsedMs);
              details.push({elapsedMs:report.elapsedMs,slowest:report.slowest,passed:report.passed});
            }
            const sorted=samples.slice().sort((a,b)=>a-b);
            const median=sorted[2];
            const summary='## RX Queen repeated timing\\nSamples (ms): '+samples.join(', ')+'\\nMedian: '+median+' ms; min: '+sorted[0]+' ms; max: '+sorted[4]+' ms.\\n';
            console.log(summary);
            require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
            const fs=require('node:fs');
            fs.mkdirSync('rx-bibi-reports',{recursive:true});
            fs.writeFileSync('rx-bibi-reports/rx-fast-queen-timing.json',JSON.stringify({schema:1,kind:'rx-fast-queen-timing',samples,medianMs:median,minMs:sorted[0],maxMs:sorted[4],details,productionModified:false},null,2)+'\n');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rx-performance-benchmark
          path: |
            rx-bibi-reports/rx-performance-benchmark.json
            rx-bibi-reports/rx-fast-queen-timing.json
          retention-days: 7
