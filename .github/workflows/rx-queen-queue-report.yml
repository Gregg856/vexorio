name: RX Queen — publish read-only ant queue snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rx-system-status.cjs'
      - 'rx-queen-ant-supervisor.cjs'
      - 'rx-ant-task-board.cjs'
      - '.github/workflows/rx-queen-queue-report.yml'
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: rx-queen-queue-report
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real isolated Browser and Programs checks
        shell: bash
        run: |
          mkdir -p rx-bibi-reports
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          rm -f rx-bibi-reports/rx-queen-panel-browser.json rx-bibi-reports/rx-queen-panel-check.json rx-bibi-reports/rx-programs-browser.json
          for module in browser programs; do
            if [ "$module" = browser ]; then script=tests/rx-queen-panel-browser.cjs; report=rx-queen-panel-browser.json; kind=rx-queen-panel-browser; else script=tests/rx-programs-browser.cjs; report=rx-programs-browser.json; kind=rx-programs-browser; fi
            log="$(mktemp)"
            if node "$script" >"$log" 2>&1; then
              cat "$log"
              if [ ! -s "rx-bibi-reports/$report" ]; then
                node -e 'const fs=require("fs");fs.writeFileSync("rx-bibi-reports/"+process.argv[1],JSON.stringify({schema:1,kind:process.argv[2],ok:false,error:"Test exited successfully but report missing",productionTouched:false},null,2)+"\\n")' "$report" "$kind"
              fi
            else
              cat "$log"
              REPORT="$report" KIND="$kind" LOG="$log" node - <<'NODE'
          const fs=require('fs');
          const log=fs.readFileSync(process.env.LOG,'utf8').slice(-3000);
          fs.writeFileSync('rx-bibi-reports/'+process.env.REPORT,JSON.stringify({schema:1,kind:process.env.KIND,ok:false,error:log||'Test failed',productionTouched:false},null,2)+'\n');
          NODE
            fi
            if [ "$module" = browser ] && [ ! -s rx-bibi-reports/rx-queen-panel-check.json ]; then
              node -e 'const fs=require("fs");fs.writeFileSync("rx-bibi-reports/rx-queen-panel-check.json",JSON.stringify({schema:1,kind:"rx-queen-panel-check",ok:false,error:"Panel report missing after browser checks",productionTouched:false},null,2)+"\n")'
            fi
            rm -f "$log"
          done
      - name: Generate deterministic review-only queue
        run: |
          node --check rx-queen-ant-supervisor.cjs
          node --check rx-ant-task-board.cjs
          node rx-queen-ant-supervisor.cjs
          node rx-ant-task-board.cjs
          node --check rx-medusa-engine.cjs
          node rx-medusa-engine.cjs
          node --check rx-ant-ai-trainer.cjs
          node rx-ant-ai-trainer.cjs
          node --check rx-mega-cloud-computer.cjs
          node -e "const fs=require('node:fs');const r=require('./rx-mega-cloud-computer.cjs').runCloudComputer({execute:false});fs.writeFileSync('rx-bibi-reports/rx-mega-cloud-computer.json',JSON.stringify(r,null,2)+'\\n')"
          node --check rx-system-status.cjs
          node rx-system-status.cjs
      - name: Validate queue and publish snapshot
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='rx-bibi-reports/rx-ant-task-board.json';
          const b=JSON.parse(fs.readFileSync(p,'utf8'));
          if(b.schema!==1||b.kind!=='rx-ant-task-board'||!Array.isArray(b.tasks)||b.tasks.length>100||b.autoFixesApplied!==0||b.tasks.some(t=>t.status!=='needs_review'||t.requiresApproval!==true))throw Error('Unsafe queue snapshot');
          const q=JSON.parse(fs.readFileSync('rx-bibi-reports/rx-cosmos-ant-queue.json','utf8'));
          const budget=JSON.parse(fs.readFileSync('rx-bibi-reports/rx-bibi-budget.json','utf8'));
          if(q.schema!==1||q.kind!=='rx-cosmos-ant-queue'||!Array.isArray(q.planned)||q.planned.length>20||q.executed!==0||q.autoFixesApplied!==0||q.planned.some(t=>t.status!=='needs_review'||t.requiresApproval!==true))throw Error('Unsafe COSMOS queue');
          if(!budget||typeof budget!=='object'||Array.isArray(budget))throw Error('Invalid RX budget');
          const status=JSON.parse(fs.readFileSync('rx-bibi-reports/rx-system-status.json','utf8'));
          const required=['queen','ants','cosmos','budget','browser','panel','programs','studio','computer','medusa','ai'];
          if(status.schema!==1||status.kind!=='rx-system-status'||status.productionTouched!==false||status.automaticActions!==0||status.total!==required.length||!status.modules||required.some(id=>!status.modules[id]||!['passed','reported','failed','missing','invalid'].includes(status.modules[id].state)))throw Error('Invalid unified RX system status');
          if(status.reviewTasks!==b.tasks.length||status.cosmosPlanned!==q.planned.length)throw Error('RX status is inconsistent with queue reports');
          console.log('RX system reports:',status.available+'/'+status.total);
          console.log('Read-only review tasks:',b.tasks.length,'COSMOS planned:',q.planned.length);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rx-bibi-reports/rx-medusa-signals.json rx-bibi-reports/rx-ant-ai-training.json rx-bibi-reports/rx-mega-cloud-computer.json rx-bibi-reports/rx-system-status.json rx-bibi-reports/rx-ant-task-board.json rx-bibi-reports/rx-cosmos-ant-queue.json rx-bibi-reports/rx-bibi-budget.json rx-bibi-reports/rx-queen-panel-browser.json rx-bibi-reports/rx-queen-panel-check.json rx-bibi-reports/rx-programs-browser.json
          if git diff --cached --quiet; then
            echo "No queue changes"
          else
            git commit -m "chore(rx): publish read-only ant queue snapshot [skip ci]"
            git push origin HEAD:main
          fi
