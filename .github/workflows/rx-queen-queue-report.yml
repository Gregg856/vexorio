name: RX Queen — publish read-only ant queue snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: rx-queen-queue-report
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real isolated Browser and Programs checks
        shell: bash
        run: |
          mkdir -p rx-bibi-reports
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          for module in browser programs; do
            if [ "$module" = browser ]; then script=tests/rx-queen-panel-browser.cjs; report=rx-queen-panel-browser.json; kind=rx-queen-panel-browser; else script=tests/rx-programs-browser.cjs; report=rx-programs-browser.json; kind=rx-programs-browser; fi
            log="$(mktemp)"
            if node "$script" >"$log" 2>&1; then
              cat "$log"
              if [ ! -s "rx-bibi-reports/$report" ]; then
                node -e 'const fs=require("fs");fs.writeFileSync("rx-bibi-reports/"+process.argv[1],JSON.stringify({schema:1,kind:process.argv[2],ok:false,error:"Test exited successfully but report missing",productionTouched:false},null,2)+"\\n")' "$report" "$kind"
              fi
            else
              cat "$log"
              REPORT="$report" KIND="$kind" LOG="$log" node - <<'NODE'
          const fs=require('fs');
          const log=fs.readFileSync(process.env.LOG,'utf8').slice(-3000);
          fs.writeFileSync('rx-bibi-reports/'+process.env.REPORT,JSON.stringify({schema:1,kind:process.env.KIND,ok:false,error:log||'Test failed',productionTouched:false},null,2)+'\\n');
          NODE
            fi
            rm -f "$log"
          done
      - name: Generate deterministic review-only queue
        run: |
          node --check rx-queen-ant-supervisor.cjs
          node --check rx-ant-task-board.cjs
          node rx-queen-ant-supervisor.cjs
          node rx-ant-task-board.cjs
      - name: Validate queue and publish snapshot
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='rx-bibi-reports/rx-ant-task-board.json';
          const b=JSON.parse(fs.readFileSync(p,'utf8'));
          if(b.schema!==1||b.kind!=='rx-ant-task-board'||!Array.isArray(b.tasks)||b.tasks.length>100||b.autoFixesApplied!==0||b.tasks.some(t=>t.status!=='needs_review'||t.requiresApproval!==true))throw Error('Unsafe queue snapshot');
          console.log('Read-only review tasks:',b.tasks.length);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rx-bibi-reports/rx-ant-task-board.json
          if git diff --cached --quiet; then
            echo "No queue changes"
          else
            git commit -m "chore(rx): publish read-only ant queue snapshot [skip ci]"
            git push origin HEAD:main
          fi
