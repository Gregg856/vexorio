name: RX Coordinator — cloud checks
on:
  pull_request:
    paths:
      - 'rx-coordinator*.cjs'
      - 'rx-command-bridge.cjs'
      - 'rx-turbine-engine.cjs'
      - 'rx-turbine-cloud-executor.cjs'
      - 'rx-energy-core.cjs'
      - 'rx-dna-core.js'
      - 'tests/rx-coordinator*.cjs'
      - '.github/workflows/rx-coordinator-cloud.yml'
  push:
    branches: [main]
    paths:
      - 'rx-coordinator*.cjs'
      - 'rx-command-bridge.cjs'
      - 'rx-turbine-engine.cjs'
      - 'rx-energy-core.cjs'
      - 'rx-dna-core.js'
      - 'tests/rx-coordinator*.cjs'
      - '.github/workflows/rx-coordinator-cloud.yml'
  workflow_dispatch:
    inputs:
      command:
        description: 'RX command (allowlisted test tasks only)'
        required: true
        default: 'Sprawdź testy w chmurze i model AI'
        type: string
permissions:
  contents: read
jobs:
  rx-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Coordinator integration tests
        run: |
          node --test tests/rx-coordinator.cjs
          node --test tests/rx-coordinator-cloud.cjs
      - name: Approved bounded checks (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          RX_COMMAND: ${{ inputs.command }}
          RX_CHECKS_APPROVED: 'true'
        run: |
          node rx-coordinator-cloud.cjs "$RX_COMMAND"
          RX_TURBINE_APPROVED=true node rx-turbine-cloud-executor.cjs
      - name: Upload measured turbine report
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: rx-turbine-power-execution
          path: rx-bibi-reports/rx-turbine-power-execution.json
          if-no-files-found: warn
