name: RX Coordinator — approved cloud checks
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'RX command (allowlisted test tasks only)'
        required: true
        default: 'Sprawdź testy w chmurze i model AI'
        type: string
permissions:
  contents: read
jobs:
  rx-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Coordinator tests
        run: node --test tests/rx-coordinator-cloud.cjs
      - name: Approved bounded checks
        env:
          RX_COMMAND: ${{ inputs.command }}
          RX_CHECKS_APPROVED: 'true'
        run: node rx-coordinator-cloud.cjs "$RX_COMMAND"
