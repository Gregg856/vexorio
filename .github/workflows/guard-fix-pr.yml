name: Strażak — propozycja poprawki PR
on:
  workflow_run:
    workflows: ['RX Strazak — monitoring 24/7']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tylko test bramek bez generowania zmian i PR'
        required: false
        type: boolean
        default: false
      target:
        description: 'Dozwolony plik Strażaka, np. guard-chat.js'
        required: true
        type: string
      smoke_test:
        description: 'Kontrolny PR tylko z plikiem testowym (bez zmian produkcyjnych)'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: strazak-fix-proposal
  cancel-in-progress: false
jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RX_TARGET: ${{ github.event_name != 'workflow_dispatch' && 'guard-chat.js' || inputs.target }}
    steps:
      - name: Confirm monitor failure before automated proposal
        id: monitor_gate
        if: github.event_name == 'workflow_run'
        env:
          MONITOR_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$MONITOR_RESULT" = failure ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "RX: monitoring failed; safe proposal may proceed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RX: monitoring healthy or inconclusive; no automatic repair." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify RX safety gates (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/checkout@v4
      - name: Check safety gate definitions (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        shell: bash
        run: |
          set -euo pipefail
          echo 'RX dry-run: no patch and no PR will be created.' >> "$GITHUB_STEP_SUMMARY"
          node -e "const fs=require('node:fs'); const s=fs.readFileSync('.github/workflows/guard-fix-pr.yml','utf8'); for(const x of ['workflow_run:', 'conclusion == \'failure\'', 'draft: true', 'Verify allowed changed files']) if(!s.includes(x)) throw Error('Missing safety gate: '+x); console.log('RX safety gates OK')"
      - name: Avoid duplicate automatic draft PR
        id: existing
        if: github.event_name != 'workflow_dispatch' && steps.monitor_gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const active=prs.some(pr=>pr.draft&&pr.head.ref.startsWith('strazak/safe-fix-'));
            core.setOutput('skip',active?'true':'false');
            if(active)core.notice('Existing RX draft PR: skip duplicate automatic proposal');
      - name: Record autonomous RX decision
        if: github.event_name != 'workflow_dispatch'
        env:
          RX_EVENT: ${{ github.event_name }}
          RX_MONITOR_RESULT: ${{ github.event.workflow_run.conclusion }}
          RX_DUPLICATE: ${{ steps.existing.outputs.skip }}
        run: |
          {
            echo '### RX Strażak — decyzja automatyczna'
            echo "Źródło: $RX_EVENT"
            echo "Wynik monitoringu: ${RX_MONITOR_RESULT:-nie dotyczy}"
            echo "Istniejący roboczy PR: ${RX_DUPLICATE:-nie}"
            echo 'Naprawa ograniczona do plików RX; PR roboczy, bez automatycznego scalania.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read RX incident classification before repair
        id: scope
        if: github.event_name == 'workflow_run' && steps.existing.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const runId=context.payload.workflow_run.id;
            let result;
            try {
              result=await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:runId,per_page:100});
            } catch(error) {
              core.warning('Nie mozna odczytac artefaktow RX: '+error.message);
              core.setOutput('skip','true');
              core.setOutput('classification_found','false');
              return;
            }
            const artifact=result.data.artifacts.find(a=>a.name==='rx-classification-'+runId&&!a.expired);
            core.setOutput('skip','true');
            core.setOutput('classification_found',artifact?'true':'false');
            core.summary.addHeading('RX: klasyfikacja przed automatyczna naprawa',3);
            core.summary.addRaw('Monitoring: '+context.payload.workflow_run.html_url+'\\n\\n');
            if(!artifact){
              core.summary.addRaw('Brak klasyfikacji: bezpieczna blokada automatycznej zmiany.\\n');
            }else{
              let bytes;
              try {
                const archive=await github.rest.actions.downloadArtifact({owner,repo,artifact_id:artifact.id,archive_format:'zip'});
                bytes=Buffer.isBuffer(archive.data) ? archive.data : Buffer.from(archive.data);
              } catch(error) {
                core.warning('Nie mozna pobrac raportu RX: '+error.message);
                core.summary.addRaw('Pobranie raportu nie powiodlo sie. Brak zmian kodu.\\n');
                await core.summary.write();
                return;
              }
              const zlib=require('zlib');
              let report=null;
              for(let i=0;i+30<bytes.length;i++){
                if(bytes.readUInt32LE(i)!==0x04034b50)continue;
                const method=bytes.readUInt16LE(i+8),size=bytes.readUInt32LE(i+18);
                const nameLen=bytes.readUInt16LE(i+26),extraLen=bytes.readUInt16LE(i+28);
                const name=bytes.subarray(i+30,i+30+nameLen).toString('utf8');
                const start=i+30+nameLen+extraLen;
                if(start+size>bytes.length)break;
                if(name==='rx-classification.json'&&size>0&&size<65536){
                  const compressed=bytes.subarray(start,start+size);
                  const data=method===8?zlib.inflateRawSync(compressed):method===0?compressed:null;
                  if(data){
                    try {
                      report=JSON.parse(data.toString('utf8'));
                    } catch(error) {
                      core.warning('RX: niepoprawny JSON klasyfikacji: '+error.message);
                    }
                  }
                  break;
                }
              }
              const knownActions={
                infrastructure:'retry_checkout',
                public_availability:'verify_deploy',
                regression:'inspect_test_logs',
                unknown:'manual_review'
              };
              const valid=report&&report.schema_version===1
                && Object.prototype.hasOwnProperty.call(knownActions,report.category)
                && report.recommended_action===knownActions[report.category]
                && Array.isArray(report.failed_stages)
                && report.failed_stages.length>0
                && report.failed_stages.every(x=>['public','checkout','tests'].includes(x))
                && report.automatic_patch_allowed===false
                && typeof report.monitor_run==='string'
                && report.monitor_run.endsWith('/actions/runs/'+runId);
              if(valid){
                core.setOutput('category',report.category);
                core.summary.addRaw('Kategoria: '+report.category+'\\n');
                core.summary.addRaw('Zalecenie: '+report.recommended_action+'\\n');
              }else{
                core.warning('RX classification JSON missing or invalid; no automatic changes.');
                core.summary.addRaw('Raport niepoprawny lub nieczytelny.\\n');
              }
            }
            core.summary.addRaw('Brak autoryzowanej reguly naprawy: kod pozostaje bez zmian.\\n');
            await core.summary.write();
      - name: Summarize autonomous RX response
        if: github.event_name == 'workflow_run' && steps.existing.outputs.skip != 'true'
        env:
          RX_CLASSIFICATION_FOUND: ${{ steps.scope.outputs.classification_found }}
        shell: bash
        run: |
          {
            echo '### RX — dalsza akcja'
            if [ "$RX_CLASSIFICATION_FOUND" = true ]; then
              echo 'Raport klasyfikacji jest dostepny w artefaktach monitoringu.'
              echo 'RX zachowuje blokade zmian kodu bez sprawdzonego dopasowania do reguly naprawczej.'
            else
              echo 'Brak raportu klasyfikacji: wymagana diagnostyka monitoringu.'
            fi
            echo 'Nie wykonano automatycznego merge ani wdrozenia.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout RX sources
        if: steps.existing.outputs.skip != 'true' && steps.monitor_gate.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && inputs.dry_run != true
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate target
        if: steps.existing.outputs.skip != 'true' && steps.monitor_gate.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && inputs.dry_run != true
        env:
          TARGET: ${{ env.RX_TARGET }}
        run: |
          node -e "if (!/^guard-[a-z0-9-]+\\.js$/.test(process.env.TARGET)) process.exit(1)"
          test -f "$TARGET"
      - name: Run baseline tests
        if: steps.existing.outputs.skip != 'true' && steps.monitor_gate.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          node tests/guard-security-diagnostics.test.cjs
          node tests/guard-code-fix.test.cjs
          node tests/guard-patch-preview.test.cjs
          node tests/guard-developer-inspector.test.cjs
          node tests/guard-prepare-safe-fix.test.cjs
          node tests/guard-fix-pipeline.test.cjs
      - name: Prepare deterministic patch and audit
        if: steps.existing.outputs.skip != 'true' && steps.monitor_gate.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && inputs.dry_run != true && inputs.smoke_test != true
        env:
          TARGET: ${{ env.RX_TARGET }}
        run: |
          node guard/prepare-safe-fix.cjs "$TARGET"
          node --check "$TARGET"
          node tests/guard-patch-preview.test.cjs
          node tests/guard-code-fix.test.cjs
          node tests/guard-developer-inspector.test.cjs
          node tests/guard-prepare-safe-fix.test.cjs
      - name: Prepare harmless smoke-test fixture
        if: steps.existing.outputs.skip != 'true' && steps.monitor_gate.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && inputs.dry_run != true && inputs.smoke_test == true
        run: |
          mkdir -p tests
          printf "'use strict';\nconst assert = require('node:assert/strict');\nassert.ok(true);\n" > tests/guard-autofix-smoke.test.cjs
          node tests/guard-autofix-smoke.test.cjs
          echo 'RX smoke: only a harmless test fixture may be proposed; never merge this PR.' >> "$GITHUB_STEP_SUMMARY"
      - name: Recheck proposed code and regression suite
        if: steps.existing.outputs.skip != 'true' && steps.monitor_gate.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          node --check "$RX_TARGET"
          node tests/guard-security-diagnostics.test.cjs
          node tests/guard-code-fix.test.cjs
          node tests/guard-patch-preview.test.cjs
          node tests/guard-developer-inspector.test.cjs
          node tests/guard-prepare-safe-fix.test.cjs
          node tests/guard-fix-pipeline.test.cjs
          git diff --check
      - name: Verify allowed changed files
        if: steps.existing.outputs.skip != 'true' && steps.monitor_gate.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && inputs.dry_run != true
        env:
          TARGET: ${{ env.RX_TARGET }}
        run: |
          git diff --check
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test || false }}" = "true" ]; then
            if ! git diff --quiet -- "$TARGET"; then
              echo 'Blocked: smoke test must not change RX source code'; exit 1
            fi
          fi
          # Also reject unexpected untracked files; git diff does not list them.
          while IFS= read -r file; do
            if [ "$file" != "tests/guard-autofix-smoke.test.cjs" ] || [ "${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test || false }}" != "true" ]; then
              echo "Blocked unexpected untracked file: $file"; exit 1
            fi
          done < <(git ls-files --others --exclude-standard)
          git diff --name-only > /tmp/strazak-changed-files
          if test -s /tmp/strazak-changed-files; then
            while IFS= read -r file; do
              if [ "$file" != "$TARGET" ]; then
                echo "Blocked tracked change: $file"; exit 1
              fi
            done < /tmp/strazak-changed-files
          fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test || false }}" = "true" ]; then
            test -f tests/guard-autofix-smoke.test.cjs
          else
            test ! -e tests/guard-autofix-smoke.test.cjs
          fi
      - name: Create draft pull request (never merge)
        if: steps.existing.outputs.skip != 'true' && steps.monitor_gate.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            ${{ env.RX_TARGET }}
            tests/guard-autofix-smoke.test.cjs
          branch: strazak/safe-fix-${{ github.run_id }}
          delete-branch: true
          draft: true
          title: 'Strażak: propozycja bezpiecznej poprawki ${{ env.RX_TARGET }}'
          commit-message: 'Strażak: reviewed deterministic TLS fix proposal'
          body: |
            Automatycznie przygotowana propozycja, **bez automatycznego scalania**.
            Zakres: tylko wskazany plik Strażaka.
            Reguła: włączenie weryfikacji TLS (rejectUnauthorized: false → true).
            Przed zatwierdzeniem sprawdź diff, testy i wpływ na działanie.
            Nie zmieniono strony głównej VEXORIO.
            Smoke test: ${{ inputs.smoke_test }}. W trybie testowym PR może zawierać kontrolny plik testowy.
            Testowego PR nie scalać.
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strazak-fix-audit
          path: strazak-fix-report.json
          if-no-files-found: ignore
          retention-days: 7
