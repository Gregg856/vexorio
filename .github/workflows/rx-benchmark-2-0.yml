name: RX Benchmark 2.0
on:
  pull_request:
    paths:
      - 'rx-benchmark-2-0.cjs'
      - '.github/workflows/rx-benchmark-2-0.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 40 exploratory RX cases
        run: node rx-benchmark-2-0.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: rx-benchmark-2-0
          path: rx-bibi-reports/rx-benchmark-2-0.json
          retention-days: 7
