name: RX Strazak — monitoring 24/7
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sprawdz strone i modul RX
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://vexorio.grzegorzbub1985.workers.dev"
          failed=0
          : > /tmp/rx-monitor-errors
          for path in / /guard-lab.html /guard-chat.js /guard-rx-categories.js /guard-rx-monitor-report.js /guard-plugin-core.js /guard-rx-orchestrator.js /guard-changes-summary.json /guard-task-analyzer-plugin.js /guard-changes-report-plugin.js /guard-code-audit-plugin.js; do
            echo "Sprawdzam $path"
            if ! curl --fail --silent --show-error --location --retry 2 --retry-delay 3 --max-time 20 -H 'Cache-Control: no-cache' "$base$path" -o /tmp/guard-check; then
              echo "::error::RX monitor: niedostepny $path"
              echo "niedostepny $path" >> /tmp/rx-monitor-errors
              failed=1
            elif [ ! -s /tmp/guard-check ]; then
              echo "::error::RX monitor: pusty plik $path"
              echo "pusty plik $path" >> /tmp/rx-monitor-errors
              failed=1
            else
              case "$path" in
                /guard-lab.html)
                  if ! grep -Fq 'guardPanelChat' /tmp/guard-check; then
                    echo "::error::RX monitor: panel czatu nie zostal znaleziony w HTML"
                    echo "panel czatu nie zostal znaleziony w HTML" >> /tmp/rx-monitor-errors
                    failed=1
                  fi
                  ;;
                /guard-chat.js)
                  if ! grep -Fq 'GuardRXOrchestrator' /tmp/guard-check; then
                    echo "::error::RX monitor: nieprawidlowa zawartosc guard-chat.js"
                    echo "nieprawidlowa zawartosc guard-chat.js" >> /tmp/rx-monitor-errors
                    failed=1
                  fi
                  ;;
                /guard-rx-categories.js)
                  if ! grep -Fq 'rxCategoryNav' /tmp/guard-check; then
                    echo '::error::RX monitor: modul kategorii niepoprawny'
                    echo 'modul kategorii niepoprawny' >> /tmp/rx-monitor-errors
                    failed=1
                  fi
                  ;;
                /guard-rx-monitor-report.js)
                  if ! grep -Fq 'guardRxLiveReport' /tmp/guard-check; then
                    echo '::error::RX monitor: modul raportu niepoprawny'
                    echo 'modul raportu niepoprawny' >> /tmp/rx-monitor-errors
                    failed=1
                  fi
                  ;;
                /guard-plugin-core.js)
                  if ! grep -Fq 'GuardPlugin' /tmp/guard-check; then
                    echo "::error::RX monitor: nieprawidlowa zawartosc guard-plugin-core.js"
                    echo "nieprawidlowa zawartosc guard-plugin-core.js" >> /tmp/rx-monitor-errors
                    failed=1
                  fi
                  ;;
                /guard-rx-orchestrator.js)
                  if ! grep -Fq 'GuardRXOrchestrator' /tmp/guard-check; then
                    echo "::error::RX monitor: nieprawidlowa zawartosc koordynatora"
                    echo "nieprawidlowa zawartosc koordynatora" >> /tmp/rx-monitor-errors
                    failed=1
                  fi
                  ;;
                /guard-changes-summary.json)
                  if ! node -e '
                    const fs = require("fs");
                    const data = JSON.parse(fs.readFileSync("/tmp/guard-check", "utf8"));
                    if (!data || data.status !== "ok" || typeof data.changedFiles !== "number" ||
                        !data.summary || !["high","medium","low"].every(k => typeof data.summary[k] === "number")) {
                      process.exit(1);
                    }
                  '; then
                    echo "::error::RX monitor: raport zmian jest niepoprawny lub niekompletny"
                    echo "raport zmian jest niepoprawny lub niekompletny" >> /tmp/rx-monitor-errors
                    failed=1
                  fi
                  ;;
                /)
                  if ! grep -Eiq '<html|<!doctype html' /tmp/guard-check; then
                    echo "::error::RX monitor: brak dokumentu HTML strony glownej"
                    echo "brak dokumentu HTML strony glownej" >> /tmp/rx-monitor-errors
                    failed=1
                  fi
                  ;;
              esac
              echo "Odebrano: $path"
            fi
          done
          # Public marketplace smoke test: check the real landing-page content.
          if ! curl --fail --silent --show-error --location --retry 2 --max-time 20 -H 'Cache-Control: no-cache' "$base/" -o /tmp/vexorio-home-check; then
            echo "::error::RX monitor: nie mozna pobrac strony glownej VEXORIO"
            echo "nie mozna pobrac strony glownej VEXORIO" >> /tmp/rx-monitor-errors
            failed=1
          else
            for marker in 'VEXORIO' 'Ogłoszenia' 'Kupuj'; do
              if ! grep -Fqi "$marker" /tmp/vexorio-home-check; then
                echo "::error::RX monitor: brak podstawowego elementu strony: $marker"
                echo "brak podstawowego elementu strony: $marker" >> /tmp/rx-monitor-errors
                failed=1
              fi
            done
          fi
          # Search and listings structure smoke test (read-only).
          # This catches missing UI hooks, but does not replace browser interaction tests.
          if [ -s /tmp/vexorio-home-check ]; then
            for marker in 'id="searchBtn"' 'id="cityFilter"' 'id="radiusFilter"' 'id="quickCategoryFilter"' 'id="cards"'; do
              if ! grep -Fq "$marker" /tmp/vexorio-home-check; then
                echo "::error::RX monitor: brak elementu wyszukiwarki lub ogloszen: $marker"
                echo "brak elementu wyszukiwarki lub ogloszen: $marker" >> /tmp/rx-monitor-errors
                failed=1
              fi
            done
          fi
          # Messaging smoke test: verify inbox, conversation view and reply form.
          # Read-only checks; never send messages or touch user conversations.
          if [ -s /tmp/vexorio-home-check ]; then
            for marker in 'id="accountMessagesSection"' 'id="myConversations"' 'id="chatDialog"' 'id="chatMessages"' 'id="replyForm"' 'id="replySendBtn"'; do
              if ! grep -Fq "$marker" /tmp/vexorio-home-check; then
                echo "::error::RX monitor: brak elementu wiadomosci: $marker"
                echo "brak elementu wiadomosci: $marker" >> /tmp/rx-monitor-errors
                failed=1
              fi
            done
          fi
          # Read-only checks for login, listing creation and moderation entry point.
          # No account creation, login, listing submission or admin actions.
          if [ -s /tmp/vexorio-home-check ]; then
            for marker in 'id="authDialog"' 'id="authForm"' 'id="googleBtn"' 'id="addDialog"' 'id="addForm"' 'id="newTitle"' 'id="newCategory"' 'id="newDesc"' 'id="adminReportsBtn"'; do
              if ! grep -Fq "$marker" /tmp/vexorio-home-check; then
                echo "::error::RX monitor: brak elementu konta, ogloszenia lub moderacji: $marker"
                echo "brak elementu konta, ogloszenia lub moderacji: $marker" >> /tmp/rx-monitor-errors
                failed=1
              fi
            done
          fi
          # Check basic browser-visible page structure, not only HTTP availability.
          if ! curl --fail --silent --show-error --location --retry 2 --max-time 20 -H 'Cache-Control: no-cache' "$base/guard-lab.html" -o /tmp/guard-panel-check; then
            echo "::error::RX monitor: nie mozna pobrac panelu"
            echo "nie mozna pobrac panelu" >> /tmp/rx-monitor-errors
            failed=1
          else
            for marker in 'guardPanelChat' 'guard-chat.js' 'guard-plugin-core.js'; do
              if ! grep -Fq "$marker" /tmp/guard-panel-check; then
                echo "::error::RX monitor: panel nie zawiera $marker"
                echo "panel nie zawiera $marker" >> /tmp/rx-monitor-errors
                failed=1
              fi
            done
          fi
          if [ "$failed" -ne 0 ]; then
            {
              echo "### Konkretne uszkodzone elementy"
              echo ""
              if [ -s /tmp/rx-monitor-errors ]; then
                while IFS= read -r error; do
                  echo "- $error"
                done < /tmp/rx-monitor-errors
              else
                echo "- Nieznana przyczyna. Sprawdz log kroku monitoringu."
              fi
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "RX monitor: AWARIA" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "RX monitor: wszystkie 9 adresow odpowiada" >> "$GITHUB_STEP_SUMMARY"
      - name: Testy funkcjonalne RX i trzech wtyczek
        id: functional
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Uruchom testy funkcjonalne
        id: rx_tests
        if: steps.functional.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --check guard-chat.js
          node --check guard-rx-categories.js
          node --check guard-rx-monitor-report.js
          node tests/guard-rx-dashboard.test.cjs
          node tests/guard-security-diagnostics.test.cjs
          node tests/guard-prepare-safe-fix.test.cjs
          node tests/guard-rx-plugin-health.test.cjs
          node tests/guard-rx-empty-result-regression.test.cjs
          node tests/guard-chat.test.cjs
          node tests/guard-rx-orchestrator.test.cjs
          node tests/guard-rx-verified-fixes.test.cjs
      - name: Raport diagnostyczny RX
        if: always()
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
          CHECKOUT_RESULT: ${{ steps.functional.outcome }}
          TEST_RESULT: ${{ steps.rx_tests.outcome }}
        run: |
          {
            echo "## RX Strazak — diagnoza"
            echo ""
            echo "| Kontrola | Wynik |"
            echo "| --- | --- |"
            echo "| Strona i zasoby produkcyjne | $CHECK_RESULT |"
            echo "| Pobranie kodu testow | $CHECKOUT_RESULT |"
            echo "| Testy Node RX | $TEST_RESULT |"
            echo ""
            echo "Uruchomienie: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Kontrole HTML sprawdzaja obecnosc elementow, nie dzialanie zalogowanych funkcji."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Klasyfikuj awarie i podpowiedz naprawe
        if: steps.check.outcome == 'failure' || steps.functional.outcome == 'failure' || steps.rx_tests.outcome == 'failure'
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
          CHECKOUT_RESULT: ${{ steps.functional.outcome }}
          TEST_RESULT: ${{ steps.rx_tests.outcome }}
        run: |
          {
            echo "## RX Strazak — wskazowki naprawcze"
            if [ "$CHECK_RESULT" = "failure" ]; then
              echo "- **Produkcja / UI:** sprawdz log kroku 'Sprawdz strone i modul RX', dostepnosc Cloudflare i publikacje zasobow. Brak znacznika HTML moze oznaczac rozbieznosc wdrozenia."
            fi
            if [ "$CHECKOUT_RESULT" = "failure" ]; then
              echo "- **GitHub / kod:** sprawdz uprawnienia checkout, dostepnosc repozytorium i konfiguracje GitHub Actions."
            fi
            if [ "$TEST_RESULT" = "failure" ]; then
              echo "- **RX / wtyczki:** odczytaj pierwszy nieudany test Node, popraw jego przyczyne i uruchom test ponownie."
            fi
            echo ""
            echo "### Bezpieczna decyzja RX"
            echo "- Status: WYMAGA PRZEGLADU. Brak automatycznego wdrozenia."
            echo "- 1. Otworz logi nieudanego kroku i potwierdz przyczyne."
            echo "- 2. Sprawdz, czy w repozytorium istnieje juz otwarty incydent RX."
            echo "- 3. Jezeli poprawka dotyczy dozwolonego guard-*.js i znanej reguly TLS, uzyj generatora roboczego PR."
            echo "- 4. W pozostalych przypadkach przygotuj osobny PR z testem regresyjnym."
            echo "- 5. Wymagaj zielonych testow i zatwierdzenia przed scaleniem."
            echo ""
            echo "### Klasyfikacja incydentu"
            if [ "$CHECK_RESULT" = "failure" ]; then
              echo "- Kategoria: PRODUKCJA / ZASOBY. Priorytet: WYSOKI."
              if [ -s /tmp/rx-monitor-errors ]; then
                echo "- Wykryte zasoby lub znaczniki:"
                while IFS= read -r incident; do
                  echo "  - $incident"
                done < /tmp/rx-monitor-errors
              fi
            fi
            if [ "$TEST_RESULT" = "failure" ]; then
              echo "- Kategoria: TESTY / REGRESJA. Priorytet: WYSOKI. Szczegoly w logu testow Node."
            fi
            if [ "$CHECKOUT_RESULT" = "failure" ]; then
              echo "- Kategoria: INFRASTRUKTURA GITHUB. Priorytet: SREDNI."
            fi
            echo "- Klasyfikacja na podstawie nieudanego kroku; nie przesadza o przyczynie technicznej."
            echo ""
            echo "### Proponowany plan naprawy RX"
            if [ "$CHECK_RESULT" = "failure" ]; then
              echo "1. Porownaj niedostepne zasoby z lista plikow kopiowanych w .github/workflows/deploy.yml."
              echo "2. Sprawdz ostatni zielony deploy i wersje plikow na Cloudflare."
              echo "3. Po naprawie uruchom monitor i potwierdz HTTP 200 oraz znaczniki HTML."
            fi
            if [ "$TEST_RESULT" = "failure" ]; then
              echo "1. Odczytaj pierwszy blad w kroku 'Uruchom testy funkcjonalne'."
              echo "2. Odtworz lokalnie wskazany test Node i dodaj test regresyjny."
              echo "3. Przygotuj zmiane w osobnym PR; po zatwierdzeniu sprawdz zielony monitor."
            fi
            if [ "$CHECKOUT_RESULT" = "failure" ]; then
              echo "1. Sprawdz dostep do repozytorium i uprawnienia GitHub Actions."
              echo "2. Ponow checkout bez ujawniania tokenow w logach."
            fi
            echo ""
            echo "To diagnoza wstepna, nie automatyczna naprawa. RX nie zmienia kodu ani danych uzytkownikow."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Podpowiedz bezpieczny generator roboczego PR
        if: steps.check.outcome == 'failure' || steps.functional.outcome == 'failure' || steps.rx_tests.outcome == 'failure'
        run: |
          {
            echo "### RX Auto Fix — bezpieczne przygotowanie"
            echo "Generator roboczego PR: https://github.com/Gregg856/vexorio/actions/workflows/guard-fix-pr.yml"
            echo "Dostepna regula automatyczna: tylko wlaczenie weryfikacji TLS w wybranym guard-*.js."
            echo "Inne bledy wymagaja analizy; RX nie generuje dowolnych zmian na podstawie samych logow."
            echo "Uruchomienie generatora wymaga wyboru pliku. PR pozostaje roboczy i nie jest scalany automatycznie."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Zapisz historie awarii RX
        if: steps.check.outcome == 'failure' || steps.functional.outcome == 'failure' || steps.rx_tests.outcome == 'failure'
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
          CHECKOUT_RESULT: ${{ steps.functional.outcome }}
          TEST_RESULT: ${{ steps.rx_tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rx-incident-history
          {
            echo "RX Strazak - zapis awarii"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Produkcja: $CHECK_RESULT"
            echo "Pobranie kodu: $CHECKOUT_RESULT"
            echo "Testy RX: $TEST_RESULT"
            echo ""
            echo "Szczegoly:"
            if [ -s /tmp/rx-monitor-errors ]; then
              cat /tmp/rx-monitor-errors
            else
              echo "Brak szczegolow HTTP/UI. Sprawdz logi testow Node lub checkout."
            fi
          } > rx-incident-history/incident.txt
      - name: Archiwizuj historie awarii RX (30 dni)
        if: steps.check.outcome == 'failure' || steps.functional.outcome == 'failure' || steps.rx_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rx-incident-${{ github.run_id }}
          path: rx-incident-history/incident.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Powiadom przez jedno zgloszenie GitHub o awarii
        if: steps.check.outcome == 'failure' || steps.functional.outcome == 'failure' || steps.rx_tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[RX MONITOR] Awaria VEXORIO';
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner,repo,state:'all',per_page:100});
            const incidents = issues.filter(i => !i.pull_request && i.title === title);
            const existing = incidents.find(i => i.state === 'open');
            const last30 = incidents.filter(i => Date.now() - new Date(i.created_at).getTime() <= 30 * 24 * 60 * 60 * 1000);
            const previousClosed = last30.filter(i => i.state === 'closed');
            // Stable fingerprint from exact failed resources / UI markers and failed stages.
            // Never include account data, message contents or other personal information.
            const fs = require('fs');
            const crypto = require('crypto');
            const rawErrors = fs.existsSync('/tmp/rx-monitor-errors')
              ? fs.readFileSync('/tmp/rx-monitor-errors', 'utf8').split(/\\r?\\n/).filter(Boolean)
              : [];
            const stages = [
              ['production', '${{ steps.check.outcome }}'],
              ['checkout', '${{ steps.functional.outcome }}'],
              ['rx-tests', '${{ steps.rx_tests.outcome }}']
            ].filter(([, status]) => status === 'failure').map(([name]) => name);
            const signatureItems = [...new Set([...stages.map(x => 'stage:' + x), ...rawErrors.map(x => 'detail:' + x)])].sort();
            const fingerprint = crypto.createHash('sha256').update(signatureItems.join('\\n')).digest('hex').slice(0, 16);
            const exactMatches = previousClosed.filter(i => (i.body || '').includes('RX-FINGERPRINT: ' + fingerprint));
            const priorReferences = exactMatches.slice(0, 3).map(i =>
              '- [Poprzedni incydent #' + i.number + '](' + i.html_url + ') — zamkniety ' + (i.closed_at || 'brak daty')
            );
            const priorNote = priorReferences.length
              ? '\\n\\nPowiazane poprzednie incydenty:\\n' + priorReferences.join('\\n')
              : '';
            const matchNote = exactMatches.length
              ? 'Ten sam zestaw sygnalow wystapil w ' + exactMatches.length + ' zamknietych incydentach z ostatnich 30 dni.'
              : 'Brak identycznego zestawu sygnalow w zamknietych incydentach z ostatnich 30 dni.';

            // Consult only explicitly verified fixes; never infer success from closed issues.
            let fixNote = 'Brak potwierdzonej poprawki dla tego odcisku.';
            try {
              const file = await github.rest.repos.getContent({
                owner, repo, path: 'docs/rx-confirmed-fixes.md', ref: context.sha
              });
              if ('content' in file.data) {
                const markdown = Buffer.from(file.data.content, 'base64').toString('utf8');
                const entries = markdown.split(/^### RX-FIX-/m).slice(1);
                for (const entry of entries) {
                  const status = entry.match(/^- \*\*Status:\*\*\s*(.+)$/m)?.[1]?.trim().toLowerCase();
                  const match = entry.match(/^- \*\*Odcisk awarii \(RX-FINGERPRINT\):\*\*\s*([a-f0-9]{16})\s*$/m);
                  const commit = entry.match(/^- \*\*Commit lub PR:\*\*\s*(https:\/\/\S+)/m);
                  const test = entry.match(/^- \*\*Test regresyjny:\*\*\s*(https:\/\/\S+)/m);
                  if (status === 'potwierdzone' && match?.[1] === fingerprint && commit && test) {
                    const id = entry.split(' — ')[0].trim();
                    fixNote = 'Potwierdzona poprawka RX-FIX-' + id + ': ' + commit[1] + ' | test: ' + test[1];
                    break;
                  }
                }
              }
            } catch (error) {
              core.warning('Nie udalo sie odczytac bazy RX: ' + error.message);
              fixNote = 'Baza rozwiazan niedostepna; sprawdz dokumentacje recznie.';
            }
            const recurrence = previousClosed.length > 0
              ? 'Uwaga: w ostatnich 30 dniach wystapilo ' + previousClosed.length + ' wczesniejszych, zamknietych incydentow RX. Nie musi to byc ta sama przyczyna.'
              : 'Brak wczesniejszych zamknietych incydentow RX z ostatnich 30 dni.';
            await core.summary.addHeading('Historia incydentow RX', 3).addRaw(recurrence + '\\n\\n' + matchNote + priorNote + '\\n\\n' + fixNote + '\\n\\nOdcisk bledu: ' + fingerprint).write();
            const body = 'Monitoring wykrył niedostępny zasób lub nieudany test funkcjonalny RX. Sprawdź [logi uruchomienia](' +
              context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId +
              '). RX nie zmienia automatycznie kodu.\n\n' + recurrence + '\\n\\n' + matchNote + priorNote + '\\n\\n' + fixNote + '\\n\\nRX-FINGERPRINT: ' + fingerprint;
            if (existing) {
              // One open incident is enough: avoid waking the owner every 30 minutes.
              // Keep one open issue, but record a new signature once if the failure changes.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,repo,issue_number:existing.number,per_page:100
              });
              const marker = 'RX-FINGERPRINT: ' + fingerprint;
              const alreadyRecorded = (existing.body || '').includes(marker) ||
                comments.some(c => (c.body || '').includes(marker));
              if (!alreadyRecorded) {
                await github.rest.issues.createComment({
                  owner,repo,issue_number:existing.number,
                  body:'RX wykrył nowy zestaw sygnałów podczas trwającego incydentu. ' +
                    '[Logi uruchomienia](' + context.serverUrl + '/' + owner + '/' + repo +
                    '/actions/runs/' + context.runId + ').\\n\\n' + matchNote +
                    priorNote + '\\n\\n' + fixNote + '\\n\\n' + marker
                });
              }
              core.notice('RX incident already open: #' + existing.number);
            } else {
              await github.rest.issues.create({owner,repo,title,body,assignees:[owner]});
            }
      - name: Zamknij alarm po odzyskaniu dostepnosci
        if: steps.check.outcome == 'success' && steps.functional.outcome == 'success' && steps.rx_tests.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const title = '[RX MONITOR] Awaria VEXORIO';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner,repo,state:'open',per_page:100});
            for (const issue of issues.filter(i => !i.pull_request && i.title === title)) {
              await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:'Monitoring ponownie potwierdził dostępność zasobów i pomyślne testy funkcjonalne RX. Alarm zamknięty automatycznie.'});
              await github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed',state_reason:'completed'});
            }
      - name: Zakoncz czerwonym statusem przy awarii
        if: steps.check.outcome == 'failure' || steps.functional.outcome == 'failure' || steps.rx_tests.outcome == 'failure'
        run: exit 1
