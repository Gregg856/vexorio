name: RX Strazak — monitoring 24/7
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sprawdz strone i modul RX
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://vexorio.grzegorzbub1985.workers.dev"
          failed=0
          for path in / /guard-lab.html /guard-chat.js /guard-plugin-core.js /guard-rx-orchestrator.js; do
            echo "Sprawdzam $path"
            if ! curl --fail --silent --show-error --location --retry 2 --retry-delay 3 --max-time 20 -H 'Cache-Control: no-cache' "$base$path" -o /tmp/guard-check; then
              echo "::error::RX monitor: niedostepny $path"
              failed=1
            elif [ ! -s /tmp/guard-check ]; then
              echo "::error::RX monitor: pusty plik $path"
              failed=1
            else
              case "$path" in
                /guard-lab.html)
                  if ! grep -Fq 'guardPanelChat' /tmp/guard-check; then
                    echo "::error::RX monitor: panel czatu nie zostal znaleziony w HTML"
                    failed=1
                  fi
                  ;;
                /guard-chat.js)
                  if ! grep -Fq 'GuardRXOrchestrator' /tmp/guard-check; then
                    echo "::error::RX monitor: nieprawidlowa zawartosc guard-chat.js"
                    failed=1
                  fi
                  ;;
                /guard-plugin-core.js)
                  if ! grep -Fq 'GuardPlugin' /tmp/guard-check; then
                    echo "::error::RX monitor: nieprawidlowa zawartosc guard-plugin-core.js"
                    failed=1
                  fi
                  ;;
                /guard-rx-orchestrator.js)
                  if ! grep -Fq 'GuardRXOrchestrator' /tmp/guard-check; then
                    echo "::error::RX monitor: nieprawidlowa zawartosc koordynatora"
                    failed=1
                  fi
                  ;;
                /)
                  if ! grep -Eiq '<html|<!doctype html' /tmp/guard-check; then
                    echo "::error::RX monitor: brak dokumentu HTML strony glownej"
                    failed=1
                  fi
                  ;;
              esac
              echo "Odebrano: $path"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "RX monitor: AWARIA" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "RX monitor: wszystkie 5 adresow odpowiada" >> "$GITHUB_STEP_SUMMARY"
      - name: Testy funkcjonalne RX i trzech wtyczek
        id: functional
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Uruchom testy funkcjonalne
        id: rx_tests
        if: steps.functional.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --check guard-chat.js
          node tests/guard-rx-plugin-health.test.cjs
          node tests/guard-rx-empty-result-regression.test.cjs
          node tests/guard-chat.test.cjs
          node tests/guard-rx-orchestrator.test.cjs
      - name: Powiadom przez jedno zgloszenie GitHub o awarii
        if: steps.check.outcome == 'failure' || steps.functional.outcome == 'failure' || steps.rx_tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[RX MONITOR] Awaria VEXORIO';
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner,repo,state:'open',per_page:100});
            const existing = issues.find(i => !i.pull_request && i.title === title);
            const body = 'Monitoring wykrył niedostępny zasób lub nieudany test funkcjonalny RX. Sprawdź [logi uruchomienia](' +
              context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId +
              '). RX nie zmienia automatycznie kodu.';
            if (existing) {
              await github.rest.issues.createComment({owner,repo,issue_number:existing.number,body});
            } else {
              await github.rest.issues.create({owner,repo,title,body});
            }
      - name: Zamknij alarm po odzyskaniu dostepnosci
        if: steps.check.outcome == 'success' && steps.functional.outcome == 'success' && steps.rx_tests.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const title = '[RX MONITOR] Awaria VEXORIO';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner,repo,state:'open',per_page:100});
            for (const issue of issues.filter(i => !i.pull_request && i.title === title)) {
              await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:'Monitoring ponownie potwierdził dostępność zasobów i pomyślne testy funkcjonalne RX. Alarm zamknięty automatycznie.'});
              await github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed',state_reason:'completed'});
            }
      - name: Zakoncz czerwonym statusem przy awarii
        if: steps.check.outcome == 'failure' || steps.functional.outcome == 'failure' || steps.rx_tests.outcome == 'failure'
        run: exit 1
