      - name: RX Developer — plan napraw na podstawie kolejki
        if: ${{ always() }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const dir='rx-bibi-reports';
          const read=name=>{try{return JSON.parse(fs.readFileSync(dir+'/'+name,'utf8'))}catch{return null}};
          const handoff=read('rx-developer-test-handoff.json');
          const plans={
            'authenticated-client-chat':{diagnosis:'Authentication rejected; application chat remains unverified',checks:['Inspect the Supabase authentication error code without logging secrets','Verify existing test-account configuration and server auth settings','Rerun authenticated end-to-end chat after correcting configuration'],target:'tests/rx-client-auth-e2e.cjs',safeToAutofix:false},
            'local-dialogue':{diagnosis:'Local dialogue regression',checks:['Inspect failed dialogue scenarios','Reproduce with existing local test harness','Prepare minimal patch and run regression tests'],target:'tests/rx-chat-planner.mjs',safeToAutofix:false}
          };
          const tasks=(handoff?.tasks||[]).map(task=>{const proposal={...(plans[task.component]||{diagnosis:'Unknown test failure',checks:['Inspect source report'],safeToAutofix:false})};if(task.component==='authenticated-client-chat'){if(task.failureCategory==='TEST_CREDENTIALS_MISSING'){proposal.diagnosis='Dedicated test credentials missing';proposal.checks=['Check presence of existing RX_BIBI_TEST_EMAIL and RX_BIBI_TEST_PASSWORD secrets (never print values)','Do not change application authentication or bypass login'];}else if(task.failureCategory==='TEST_ACCOUNT_LOGIN_REJECTED'){proposal.diagnosis='Supabase rejected dedicated test account';proposal.checks=['Verify the dedicated account exists and is allowed to sign in','Check test-secret account pairing without logging credentials','Rerun real authenticated E2E'];}else if(task.failureCategory==='AUTH_UI_OR_NETWORK_FAILURE'){proposal.diagnosis='Client authentication UI or network failed';proposal.checks=['Inspect client panel initialization and HTTP errors','Rerun browser E2E with bounded timeouts'];}else if(task.failureCategory==='AUTHENTICATED_CHAT_FAILURE'){proposal.diagnosis='Authentication succeeded but chat failed';proposal.checks=['Inspect failed chat turn and API response','Reproduce with existing real browser E2E'];}}return {...task,proposal};});
          const result={schema:1,kind:'rx-developer-repair-proposals',runId:handoff?.runId||'',tasks,requiresReview:true,codeChanged:false};
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(dir+'/rx-developer-repair-proposals.json',JSON.stringify(result,null,2)+'\n');
          console.log('RX Developer repair proposals:',tasks.length,'manual review required');
          NODE
      - name: RX Developer — przygotuj bezpiecznego kandydata poprawki (bez zapisu do repo)
        if: ${{ always() }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const path=require('node:path');
          const dir='rx-bibi-reports';
          const read=name=>{try{return JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'))}catch{return null}};
          const plans=read('rx-developer-repair-proposals.json');
          fs.mkdirSync(dir,{recursive:true});
          const result={schema:1,kind:'rx-developer-patch-candidate',status:'NO_SAFE_PATCH',candidates:[],codeChanged:false,productionChanged:false};
          for(const task of (plans?.tasks||[]).slice(0,10)){
            if(task.component==='authenticated-client-chat'){
              const category=task.failureCategory||'UNCLASSIFIED';
              const guidance={
                TEST_CREDENTIALS_MISSING:{status:'ACTION_REQUIRED_TEST_SECRETS',action:'Configure dedicated test account credentials in GitHub Actions secrets; do not bypass login'},
                TEST_ACCOUNT_LOGIN_REJECTED:{status:'ACTION_REQUIRED_TEST_ACCOUNT',action:'Verify dedicated test account is active and credentials match, without logging values'},
                AUTH_UI_OR_NETWORK_FAILURE:{status:'REPRODUCE_AUTH_UI_FAILURE',action:'Inspect browser login UI and network failures before proposing code changes'},
                AUTHENTICATED_CHAT_FAILURE:{status:'REPRODUCE_CHAT_FAILURE',action:'Inspect failed authenticated turn and response; require reproduction before code changes'}
              };
              const entry=guidance[category]||{status:'AUTH_FAILURE_UNCLASSIFIED',action:'Inspect authentication evidence'};
              result.candidates.push({component:task.component,failureCategory:category,...entry,codePatchAllowed:false});
              continue;
            }
            if(task.component!=='local-dialogue'||task.status!=='FAIL')continue;
            const target='tests/rx-chat-planner.mjs';
            if(!fs.existsSync(target)){result.candidates.push({component:task.component,status:'TARGET_MISSING'});continue;}
            const original=fs.readFileSync(target,'utf8');
            // Strictly allow one known, deterministic typo repair; never execute proposed shell commands.
            const typo='tests/rx-dialogue-tests.cjs';
            const correct='tests/rx-chat-planner.mjs';
            if(!original.includes(typo)){result.candidates.push({component:task.component,status:'NO_APPROVED_RECIPE'});continue;}
            const fixed=original.split(typo).join(correct);
            const candidatePath=path.join(dir,'rx-dialogue-candidate.mjs');
            fs.writeFileSync(candidatePath,fixed);
            const syntax=cp.spawnSync(process.execPath,['--check',candidatePath],{encoding:'utf8',timeout:15000,maxBuffer:8192});
            if(syntax.status!==0){result.candidates.push({component:task.component,status:'CANDIDATE_SYNTAX_FAIL'});continue;}
            const patch=cp.spawnSync('diff',['-u','--label','a/'+target,'--label','b/'+target,target,candidatePath],{encoding:'utf8',timeout:10000,maxBuffer:32768});
            if(patch.status!==1){result.candidates.push({component:task.component,status:'PATCH_NOT_CREATED'});continue;}
            // Validate the candidate in an isolated checkout copy, not the working tree.
            const os=require('node:os');
            const temp=fs.mkdtempSync(path.join(os.tmpdir(),'rx-patch-'));
            let validation='NOT_RUN';
            try{
              fs.cpSync('rx-chat-planner.mjs',path.join(temp,'rx-chat-planner.mjs'));
              fs.mkdirSync(path.join(temp,'tests'),{recursive:true});
              fs.writeFileSync(path.join(temp,target),fixed);
              const regression=cp.spawnSync(process.execPath,[path.join(temp,target)],{cwd:temp,encoding:'utf8',timeout:60000,maxBuffer:16384,env:{...process.env,CI:'true'}});
              validation=regression.status===0?'PASS':'FAIL';
            }catch{validation='ERROR';}
            finally{fs.rmSync(temp,{recursive:true,force:true});}
            if(validation!=='PASS'){
              result.candidates.push({component:task.component,status:'CANDIDATE_REGRESSION_FAILED',target,validation});
              continue;
            }
            fs.writeFileSync(path.join(dir,'rx-developer-proposed.patch'),patch.stdout);
            result.candidates.push({component:task.component,status:'PATCH_READY_FOR_REVIEW',target,recipe:'known-dialogue-path-typo',syntax:'PASS',isolatedRegression:validation});
            result.status='PATCH_READY_FOR_REVIEW';
          }
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(path.join(dir,'rx-developer-patch-candidate.json'),JSON.stringify(result,null,2)+'\n');
          console.log('RX Developer patch candidate:',result.status);
          NODE
      - name: RX Developer — sprawdź mechanizm izolacji na dobrym i złym kandydacie
        if: ${{ always() }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const os=require('node:os');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const tmp=fs.mkdtempSync(path.join(os.tmpdir(),'rx-patch-selftest-'));
          const run=(source)=>{
            const file=path.join(tmp,'candidate.cjs');
            fs.writeFileSync(file,source);
            return cp.spawnSync(process.execPath,[file],{cwd:tmp,encoding:'utf8',timeout:10000,maxBuffer:4096}).status;
          };
          let status='FAIL';
          try{
            assert.equal(run("const assert=require('node:assert/strict');assert.equal(2+2,4);"),0);
            assert.notEqual(run("const assert=require('node:assert/strict');assert.equal(2+2,5);"),0);
            status='PASS';
          }finally{fs.rmSync(tmp,{recursive:true,force:true});}
          const dir='rx-bibi-reports';
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(path.join(dir,'rx-patch-isolation-selftest.json'),JSON.stringify({schema:1,kind:'rx-patch-isolation-selftest',status,positiveCandidate:'PASS',negativeCandidate:'REJECTED',productionChanged:false},null,2)+'\n');
          console.log('RX Developer isolated patch self-test:',status);
          NODE
      - name: RX AUTOPILOT — wykonaj bezpieczne kontrole wskazanych plików
        if: ${{ always() }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const dir='rx-bibi-reports';
          const read=name=>{try{return JSON.parse(fs.readFileSync(dir+'/'+name,'utf8'))}catch{return null}};
          const proposals=read('rx-developer-repair-proposals.json');
          const allow=new Set(['tests/rx-client-auth-e2e.cjs','tests/rx-chat-planner.mjs']);
          const reproductionAllow=new Set(['tests/rx-chat-planner.mjs','tests/rx-client-ui-mock.cjs']);
          const tasks=[];
          for(const item of (proposals?.tasks||[]).slice(0,10)){
            const target=item.proposal?.target;
            if(!allow.has(target)){tasks.push({component:item.component,status:'SKIPPED_UNAPPROVED_TARGET'});continue;}
            const run=cp.spawnSync(process.execPath,['--check',target],{encoding:'utf8',timeout:15000,maxBuffer:8192});
            tasks.push({component:item.component,target,check:'node --check',status:item.component==='authenticated-client-chat'&&run.status===0?'DIAGNOSTIC_ONLY':run.status===0?'PASS':'FAIL',exitCode:run.status,error:run.status===0?null:String(run.stderr||'syntax check failed').slice(0,300)});
            // Execute the existing regression harness when a local dialogue failure is reported.
            // The authenticated browser check cannot be repeated without valid test credentials.
            if(item.component==='local-dialogue'&&run.status===0){
              const regression=cp.spawnSync(process.execPath,[target],{encoding:'utf8',timeout:90000,maxBuffer:16384,env:{...process.env,CI:'true'}});
              tasks.push({component:item.component,target,check:'local dialogue regression',status:regression.status===0?'PASS':'FAIL',exitCode:regression.status,output:String((regression.stdout||'')+'\\n'+(regression.stderr||'')).slice(-1000)});
            }
          }
          // Independent bounded replay of local chat and UI mock; no production credentials.
          if((proposals?.tasks||[]).some(t=>t.component==='authenticated-client-chat'&&t.failureCategory==='AUTHENTICATED_CHAT_FAILURE')){
            for(const target of reproductionAllow){
              const replay=cp.spawnSync(process.execPath,[target],{encoding:'utf8',timeout:60000,maxBuffer:16384,env:{...process.env,CI:'true'}});
              tasks.push({component:'authenticated-client-chat',target,check:'isolated reproduction (not authenticated)',status:replay.status===0?'DIAGNOSTIC_ONLY':'FAIL',exitCode:replay.status,output:String((replay.stdout||'')+'\\n'+(replay.stderr||'')).slice(-800)});
            }
          }
          const result={schema:1,kind:'rx-autopilot-executed-checks',runId:process.env.GITHUB_RUN_ID||'',tasks,codeChanged:false,productionChanged:false};
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(dir+'/rx-autopilot-executed-checks.json',JSON.stringify(result,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### RX AUTOPILOT — wykonane kontrole\n'+(tasks.length?tasks.map(t=>'- '+t.component+': '+t.status).join('\n'):'- Brak zadań do sprawdzenia')+'\n');
          console.log('RX AUTOPILOT checks executed:',tasks.length);
          NODE
      - name: RX AUTOPILOT — wybierz ścieżkę naprawy z wyników odtworzenia
        if: ${{ always() }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const dir='rx-bibi-reports';
          const read=name=>{try{return JSON.parse(fs.readFileSync(dir+'/'+name,'utf8'))}catch{return null}};
          const plans=read('rx-developer-repair-proposals.json');
          const checks=read('rx-autopilot-executed-checks.json');
          const candidate=read('rx-developer-patch-candidate.json');
          const routes=[];
          const chooseAuth=(category,failedReplay)=>category==='TEST_CREDENTIALS_MISSING'?'CONFIGURE_TEST_SECRETS':category==='TEST_ACCOUNT_LOGIN_REJECTED'?'VERIFY_TEST_ACCOUNT':failedReplay?'REVIEW_REPRODUCED_LOCAL_FAILURE':category==='AUTHENTICATED_CHAT_FAILURE'?'INVESTIGATE_AUTHENTICATED_ONLY_FAILURE':'INSPECT_AUTH_NETWORK';
          const chooseDialogue=(patch,regression)=>patch?'REVIEW_PATCH':regression==='FAIL'?'REPRODUCED_NEEDS_MANUAL_FIX':'CHECK_DIALOGUE_EVIDENCE';
          const assert=require('node:assert/strict');
          for(const [category,failedReplay,expected] of [
            ['TEST_CREDENTIALS_MISSING',false,'CONFIGURE_TEST_SECRETS'],
            ['TEST_ACCOUNT_LOGIN_REJECTED',false,'VERIFY_TEST_ACCOUNT'],
            ['AUTHENTICATED_CHAT_FAILURE',true,'REVIEW_REPRODUCED_LOCAL_FAILURE'],
            ['AUTHENTICATED_CHAT_FAILURE',false,'INVESTIGATE_AUTHENTICATED_ONLY_FAILURE'],
            ['AUTH_UI_OR_NETWORK_FAILURE',false,'INSPECT_AUTH_NETWORK']
          ])assert.equal(chooseAuth(category,failedReplay),expected);
          assert.equal(chooseDialogue(true,'FAIL'),'REVIEW_PATCH');
          assert.equal(chooseDialogue(false,'FAIL'),'REPRODUCED_NEEDS_MANUAL_FIX');
          assert.equal(chooseDialogue(false,'PASS'),'CHECK_DIALOGUE_EVIDENCE');
          for(const task of (plans?.tasks||[]).slice(0,10)){
            const component=task.component;
            const evidence=(checks?.tasks||[]).filter(x=>x.component===component);
            const patch=(candidate?.candidates||[]).find(x=>x.component===component&&x.status==='PATCH_READY_FOR_REVIEW');
            if(component==='authenticated-client-chat'){
              const category=task.failureCategory||'UNCLASSIFIED';
              const failedReplay=evidence.some(x=>x.check==='isolated reproduction (not authenticated)'&&x.status==='FAIL');
              routes.push({component,failureCategory:category,route:chooseAuth(category,failedReplay),replayEvidence:evidence.length,patchApproved:false,productionChanged:false});
            }else if(component==='local-dialogue'){
              const regression=evidence.find(x=>x.check==='local dialogue regression');
              routes.push({component,route:chooseDialogue(!!patch,regression?.status),replayEvidence:evidence.length,patchApproved:false,productionChanged:false});
            }else routes.push({component,route:'MANUAL_TRIAGE',replayEvidence:evidence.length,patchApproved:false,productionChanged:false});
          }
          const result={schema:1,kind:'rx-autopilot-repair-routing',runId:process.env.GITHUB_RUN_ID||'',routes,automaticMerge:false,productionChanged:false};
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(dir+'/rx-autopilot-repair-routing.json',JSON.stringify(result,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### RX AUTOPILOT — kierowanie napraw\n'+(routes.length?routes.map(r=>'- '+r.component+': '+r.route).join('\n'):'- Brak zgłoszeń')+'\n');
          console.log('RX AUTOPILOT routing self-tests: 8 PASS; repair routes:',routes.length);
          NODE
      - name: RX AUTOPILOT — sprawdź cały łańcuch i zapisz dowody
        if: ${{ always() }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const dir='rx-bibi-reports';
          const read=name=>{try{return JSON.parse(fs.readFileSync(dir+'/'+name,'utf8'))}catch{return null}};
          const handoff=read('rx-developer-test-handoff.json');
          const proposals=read('rx-developer-repair-proposals.json');
          const execution=read('rx-autopilot-executed-checks.json');
          const tasks=Array.isArray(handoff?.tasks)?handoff.tasks:[];
          const plans=Array.isArray(proposals?.tasks)?proposals.tasks:[];
          const checks=Array.isArray(execution?.tasks)?execution.tasks:[];
          const auth=read('rx-client-auth-e2e.json');
          const authVerified=auth?.clientChatVerified===true;
          const unresolvedAuth=tasks.some(t=>t.component==='authenticated-client-chat')&&!authVerified;
          const uncovered=tasks.filter(t=>!plans.some(p=>p.component===t.component)).map(t=>t.component);
          const result={
            schema:1,kind:'rx-autopilot-chain-verification',
            runId:process.env.GITHUB_RUN_ID||'',
            handoffPresent:!!handoff,proposalsPresent:!!proposals,executionPresent:!!execution,
            reportedFailures:tasks.length,repairPlans:plans.length,executedChecks:checks.length,
            uncovered,authVerified,unresolvedAuth,checkFailures:checks.filter(t=>t.status==='FAIL').map(t=>t.component),
            verified:!!handoff&&!!proposals&&!!execution&&!unresolvedAuth&&uncovered.length===0&&tasks.every(t=>checks.some(c=>c.component===t.component&&c.status==='PASS'))&&checks.every(t=>t.status==='PASS'),
            codeChanged:false,productionChanged:false
          };
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(dir+'/rx-autopilot-chain-verification.json',JSON.stringify(result,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### RX AUTOPILOT — łańcuch diagnostyczny\n'+
            '- Raporty: '+(result.verified?'kompletne':'wymagają uwagi')+'\n'+
            '- Zgłoszenia: '+tasks.length+', plany: '+plans.length+', wykonane kontrole: '+checks.length+'\n');
          console.log('RX AUTOPILOT chain verified:',result.verified,'executed:',checks.length);
          NODE
      - name: RX BIBI — trening kandydatów i ocena na niewidzianych przykładach
        if: ${{ !cancelled() }}
