          if (summary && summary.localDialogue.status === 'FAIL') tasks.push({component:'local-dialogue',status:'FAIL',source:'rx-dialogue-tests.json',requiresReview:true});
          const handoff = {schema:1,kind:'rx-developer-test-handoff',runId:process.env.GITHUB_RUN_ID || '',tasks,automaticCodeChanges:false};
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(dir + '/rx-developer-test-handoff.json',JSON.stringify(handoff,null,2) + '\n');
          console.log('RX Developer diagnostic handoff:',tasks.length,'tasks');
