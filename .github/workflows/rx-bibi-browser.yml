name: RX BIBI Tester — mobile browser

on:
  # Full browser suite runs periodically or on explicit request, not on every push.
  workflow_dispatch:
  schedule:
    # Pełny audyt Chromium co 6 godzin; lekkie kontrole pozostają w VEXORIO checks.
    - cron: '23 */6 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: rx-bibi-browser-tests
  cancel-in-progress: true

jobs:
  fast:
    name: RX FAST — szybka kontrola mózgu i czatu
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RX BIBI — odczyt produkcyjnego panelu i zabezpieczenia API (bez logowania)
        run: node --test tests/rx-bibi-live-readonly.test.cjs
      - name: Sprawdź składnię istniejących modułów
        run: |
          node --check worker.js
          node --check rx-command-bridge.cjs
          node --check rx-queen-ai-bridge.cjs
          node --check rx-coordinator-cloud.cjs
      - name: Szybkie testy RX Queen / Coordinator
        run: |
          node --test tests/rx-ai-router.cjs
          node --test tests/rx-coordinator.cjs
          node --test tests/rx-coordinator-cloud.cjs
      - name: RX Neural — sprawdź zgodność obliczeń wsadowych
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {createNetwork,forward,predictBatch}=require('./rx-neural-core.cjs');
          const net=createNetwork(3,5,2);
          const input=new Float32Array([1,2,3,4,5,6,-1,0,1]);
          const batch=predictBatch(net,input);
          assert.equal(batch.length,6);
          for(let i=0;i<3;i++){
            const expected=forward(net,input.subarray(i*3,i*3+3)).pred;
            for(let j=0;j<2;j++)assert.ok(Math.abs(batch[i*2+j]-expected[j])<1e-5);
          }
          assert.throws(()=>predictBatch(net,new Float32Array([1,2])));
          assert.throws(()=>predictBatch(net,new Float32Array([NaN,0,1])));
          console.log('RX Neural batch: PASS 3 samples, dimensions and finite input');
          NODE
      - name: RX BIBI — 20 dodatkowych kontroli istniejących modułów
        run: |
          # 10 kontroli składni: żaden wadliwy moduł nie przechodzi dalej.
          node --check rx-medusa-engine.cjs
          node --check rx-ant-task-board.cjs
          node --check rx-mega-cloud-computer.cjs
          node --check rx-ai-core.cjs
          node --check rx-cloud-computer.cjs
          node --check rx-ant-ai-trainer.cjs
          node --check rx-queen-ant-supervisor.cjs
          node --check rx-command-bridge.js
          node --check rx-fast-test-engine.cjs
          node --check rx-bibi-budget.cjs
          # 10 testów funkcjonalnych: używamy istniejących testów, bez nowego silnika.
          node tests/rx-medusa-engine.cjs
          node tests/rx-ant-task-board.cjs
          node tests/rx-mega-cloud-computer.cjs
          node tests/rx-ai-core.cjs
          node tests/rx-cloud-computer.cjs
          node tests/rx-ant-ai-trainer.cjs
          node tests/rx-queen-ant-supervisor.cjs
          node tests/rx-command-bridge.cjs
          node tests/rx-bibi-budget.cjs
          node tests/rx-queen-ai-bridge.cjs
  ants:
    name: RX MRÓWKI — trening i pamięć modelu
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Przywróć pamięć modelu
        uses: actions/cache/restore@v4
        with:
          path: rx-ai-checkpoints/latest.json
          key: rx-ant-ai-checkpoint-${{ github.run_id }}
          restore-keys: |
            rx-ant-ai-checkpoint-
      - name: Mrówki — ucz model i porównaj z poprzednim
        run: |
          node tests/rx-ant-ai-trainer.cjs
          node tests/rx-ant-ai-evaluator.cjs
          node rx-ant-ai-evaluator.cjs
      - name: Zapisz pamięć modelu
        uses: actions/cache/save@v4
        with:
          path: rx-ai-checkpoints/latest.json
          key: rx-ant-ai-checkpoint-${{ github.run_id }}
      - name: Zachowaj raport rozwoju Królowej
        uses: actions/upload-artifact@v4
        with:
          name: rx-queen-model-growth
          path: |
            rx-bibi-reports/rx-queen-model-growth.json
            rx-bibi-reports/rx-ant-ai-evaluation.json
            rx-ai-checkpoints/latest.json
          retention-days: 14
  video:
    name: RX BIBI VIDEO — osobny audyt multimediów
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 6
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright bez pobierania przeglądarki
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --no-package-lock playwright@1.56.1
      # Heavy video export only for Studio/PhotoMotion source changes or manual audit; not scheduled runs or unrelated UI edits.
      - name: RX FAST — wybierz czy potrzebny jest test eksportu wideo
        id: video_scope
        if: always()
        env:
          RX_BEFORE: ${{ github.event.before }}
          RX_EVENT: ${{ github.event_name }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const scope=['rx-bibi-studio.html','rx-photo-motion.js','rx-video-engine.js','rx-ai-director.js','tests/rx-bibi-studio.cjs','tests/rx-bibi-encoder-diagnostic.cjs'];
          let run=process.env.RX_EVENT==='workflow_dispatch';
          if(!run && process.env.RX_EVENT==='push'){const before=process.env.RX_BEFORE||'';try{if(!/^[a-f0-9]{40}$/i.test(before))throw Error('unknown base');const files=cp.execFileSync('git',['diff','--name-only',before,'HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/);run=files.some(f=>scope.includes(f));}catch{run=false;}}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run_video='+String(run)+'\n');
          console.log('RX BIBI full video export:',run?'YES':'SKIP (unrelated changes)');
          NODE
      - name: RX BIBI — diagnostyka kodera wideo i audio
        if: always() && steps.video_scope.outputs.run_video == 'true'
        run: node tests/rx-bibi-encoder-diagnostic.cjs
      - name: Przetestuj RX BIBI AI Studio i PhotoMotion
        id: studio
        if: always() && steps.video_scope.outputs.run_video == 'true'
        run: node tests/rx-bibi-studio.cjs
  mobile:
    # Browser suite on UI changes, manual requests and scheduled audits.
    # Backend-only pushes do not need Chromium; fast checks run in VEXORIO checks.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 6
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Zainstaluj bibliotekę Playwright bez pobierania przeglądarki
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Sprawdź gotowość Chromium
        run: node -e "require('playwright').chromium.executablePath() && console.log('Chromium gotowy')"
      - name: Sprawdź składnię panelu Królowej RX
        run: node --check guard-rx-queen-panel.js
      - name: RX MRÓWKI — sprawdź błędy panelu Królowej
        run: node tests/rx-queen-panel-safety.cjs
      - name: RX MRÓWKI — klikaj panel Królowej w Chromium
        run: node tests/rx-queen-panel-browser.cjs
      - name: Sprawdź RX DNA CLOUD
        run: node tests/rx-dna-core.cjs
      - name: Sprawdź prywatny magazyn RX DNA
        run: node tests/rx-dna-store.cjs
      - name: Sprawdź bramę chmury RX
        run: node tests/rx-dna-cloud-gateway.cjs
      - name: Sprawdź transport chmury RX
        run: node tests/rx-dna-cloud-transport.cjs
      - name: Sprawdź RX MONEY ENGINE
        run: node tests/rx-money-engine.cjs
      - name: Sprawdź RX EVOLUTION i MONEY RADAR
        run: node tests/rx-evolution-radar.cjs
      - name: Sprawdź raport RX QUEEN COMPUTER
        run: node tests/rx-queen-computer-status.cjs
      - name: Sprawdź RX MEGA CLOUD COMPUTER
        run: node tests/rx-mega-cloud-computer.cjs
      - name: RX MEGA CLOUD COMPUTER — uruchom testy i zapisz raport
        run: node rx-mega-cloud-computer.cjs
      - name: RX QUEEN — zapisz stan komputera
        run: node rx-queen-computer-status.cjs
      - name: Sprawdź RX ENERGY LAB
        run: node tests/rx-energy-lab.cjs
      - name: RX ENERGY LAB — zapisz bilans energii
        run: node rx-energy-lab.cjs
      - name: Sprawdź RX COSMIC COLLIDER 10K
        run: node tests/rx-cosmic-collider.cjs
      - name: RX COSMIC COLLIDER — zapisz symulację
        run: node rx-cosmic-collider.cjs
      - name: Sprawdź RX HIGGS LAB
        run: node tests/rx-higgs-lab.cjs
      - name: RX HIGGS LAB — zapisz histogram
        run: node rx-higgs-lab.cjs
      - name: Sprawdź integrację RX z chmurą i laboratorium
        run: node tests/rx-integration.cjs
      - name: Sprawdź RX CLOUD COMPUTER 1.0
        run: node tests/rx-cloud-computer.cjs
      - name: RX MRÓWKI — odzyskaj poprzedni checkpoint AI
        uses: actions/cache/restore@v4
        with:
          path: rx-ai-checkpoints/latest.json
          key: rx-ant-ai-checkpoint-${{ github.run_id }}
          restore-keys: |
            rx-ant-ai-checkpoint-
      - name: RX MRÓWKI — sprawdź trening modelu AI
        run: node tests/rx-ant-ai-trainer.cjs
      - name: RX MRÓWKI — wytrenuj model i zapisz wagi
        run: node rx-ant-ai-trainer.cjs
      - name: RX MRÓWKI — testuj niezależną walidację AI
        run: node tests/rx-ant-ai-evaluator.cjs
      - name: RX MRÓWKI — porównaj modele i wybierz najlepszy
        run: node rx-ant-ai-evaluator.cjs
      - name: RX MRÓWKI — zachowaj checkpoint AI
        uses: actions/cache/save@v4
        with:
          path: rx-ai-checkpoints/latest.json
          key: rx-ant-ai-checkpoint-${{ github.run_id }}
      - name: RX AI 2.0 — testuj wspólny router funkcji
        run: node tests/rx-ai-router.cjs
      - name: Sprawdź RX AI CORE 1.0
        run: node tests/rx-ai-core.cjs
      - name: Sprawdź RX ANT LAB
        run: node tests/rx-ant-lab.cjs
      - name: RX ANT LAB — eksperyment i raport
        run: node rx-ant-lab.cjs
      - name: Sprawdź RX DNA LINEAGE STAGING
        run: node tests/rx-dna-lineage-staging.cjs
      - name: Sprawdź RX DNA CLOUD MEMORY
        run: node tests/rx-dna-cloud-memory.cjs
      - name: Sprawdź RX DNA MEMORY
        run: node tests/rx-dna-memory.cjs
      - name: Sprawdź RX DNA LINEAGE
        run: node tests/rx-dna-lineage.cjs
      - name: Sprawdź RX STELLAR SIGNAL
        run: node tests/rx-stellar-signal.cjs
      - name: Sprawdź RX STELLAR LAB
        run: node tests/rx-stellar-lab.cjs
      - name: RX FAST TEST ENGINE — dobór testów według zmian
        if: always()
        env:
          RX_FAST_SELECTIVE: '1'
          RX_FAST_BASE_SHA: ${{ github.event.before }}
        run: node rx-fast-test-engine.cjs
      - name: Sprawdź RX GENESIS
        run: node tests/rx-genesis.cjs
      - name: Sprawdź RX ANT HIBERNATION
        run: node tests/rx-ant-hibernation.cjs
      - name: Sprawdź silnik RX MILION SERC
        run: node tests/rx-million-hearts.cjs
      - name: Sprawdź RX COMMAND BRIDGE
        run: node tests/rx-command-bridge.cjs
      # Customer chat checks must run even when an unrelated RX module fails.
      - name: Uruchom testy RX BIBI
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tests/rx-bibi-browser.cjs
      - name: RX BIBI — sprawdź składnię Screen Recorder
        run: node --check rx-screen-recorder.js
      - name: RX BIBI — testuj Screen Recorder
        run: node tests/rx-screen-recorder.cjs
      - name: RX — sprawdź wejście do panelu administratora VEXORIO
        if: always()
        run: node tests/rx-admin-entry-mobile.cjs
      - name: RX BIBI — audyt języków PL DE EN UK na żywo
        if: always()
        run: node tests/rx-live-languages.cjs
      - name: RX BIBI — panel produkcyjny na żywo (mobile i desktop)
        if: always()
        run: node tests/rx-live-panel.cjs
      - name: RX BIBI — sprawdź czat RX na telefonie
        if: ${{ !cancelled() }}
        run: node tests/rx-chat-mobile.cjs
      - name: RX BIBI — audyt wizualny wszystkich kategorii i czatu
        run: node tests/rx-visual-audit.cjs
      - name: RX BIBI — automatyczne rozmowy bez logowania (silnik lokalny)
        run: node tests/rx-chat-planner.mjs
      - name: RX BIBI — test istniejącego czatu klienta (izolowany mock)
        if: ${{ !cancelled() }}
        run: node tests/rx-client-ui-mock.cjs
      - name: RX BIBI — zachowaj raport rozmów
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rx-bibi-dialogue-report
          path: |
            rx-bibi-reports/rx-dialogue-tests.json
            rx-bibi-reports/rx-client-ui-mock.json
          if-no-files-found: warn
          retention-days: 14
      - name: RX BIBI — prawdziwe logowanie konta testowego administratora (opcjonalne)
        if: ${{ !cancelled() }}
        env:
          RX_BIBI_TEST_EMAIL: ${{ secrets.RX_BIBI_ADMIN_TEST_EMAIL || vars.RX_BIBI_ADMIN_TEST_EMAIL }}
          RX_BIBI_TEST_PASSWORD: ${{ secrets.RX_BIBI_ADMIN_TEST_PASSWORD }}
          RX_REQUIRE_AUTH_E2E: '0'
        run: node tests/rx-admin-auth-e2e.cjs
      - name: RX BIBI — zalogowany czat klienta (opcjonalny, prawdziwy serwer)
        if: ${{ !cancelled() }}
        env:
          RX_BIBI_TEST_EMAIL: ${{ secrets.RX_BIBI_TEST_EMAIL || vars.RX_BIBI_TEST_EMAIL }}
          RX_BIBI_TEST_PASSWORD: ${{ secrets.RX_BIBI_TEST_PASSWORD }}
        run: |
          if [ -z "$RX_BIBI_TEST_EMAIL" ]; then echo "::warning::RX BIBI: missing TEST_EMAIL in repository secrets or variables"; fi
          if [ -z "$RX_BIBI_TEST_PASSWORD" ]; then echo "::warning::RX BIBI: missing TEST_PASSWORD in repository secrets"; fi
          node tests/rx-client-auth-e2e.cjs
      - name: RX BIBI — raport wiarygodności testów zalogowanego czatu
        if: ${{ always() }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const file='rx-bibi-reports/rx-client-auth-e2e.json';
          const r=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):{status:'NOT_RUN',clientChatVerified:false};
          const verdict=r.clientChatVerified?'VERIFIED':r.status||'NOT_VERIFIED';
          const lines=['### RX BIBI — prawdziwy czat klienta','', '- Status: **'+verdict+'**','- Autentyczne rozmowy: '+(r.turns?.length||0)+'/5','- Testy lokalne i mock nie zastępują zalogowanego E2E.'];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log('RX BIBI REAL CHAT VERDICT:',verdict);
          NODE
      - name: RX BIBI — zachowaj dowody zalogowanej rozmowy
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rx-bibi-real-chat-evidence
          path: rx-bibi-reports/rx-client-auth-e2e.json
          if-no-files-found: warn
          retention-days: 14
      - name: RX — testuj nawigację mobilną Centrum i powrót do VEXORIO
        if: always()
        run: node tests/rx-navigation-mobile.cjs
      - name: RX MRÓWKI — testuj katalog w Chromium
        if: always()
        run: node tests/rx-programs-browser.cjs
      - name: RX MRÓWKI — testuj nadzorcę Królowej
        if: always()
        run: node tests/rx-queen-ant-supervisor.cjs
      - name: RX QUEEN — zbierz błędy chmury i AI
        if: always()
        run: node rx-queen-ant-supervisor.cjs
      - name: RX MEDUSA — przekaz sygnałów do Królowej
        if: always()
        run: node rx-medusa-engine.cjs
      - name: RX MEMORY — odzyskaj historię z poprzednich przebiegów
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: rx-memory-cache/history.json
          key: rx-signal-memory-${{ github.run_id }}
          restore-keys: |
            rx-signal-memory-
      - name: RX MEMORY — testuj pamięć powracających błędów
        if: always()
        run: node tests/rx-signal-memory.cjs
      - name: RX MEMORY — zapisz sygnały
        if: always()
        run: node rx-signal-memory.cjs
      - name: RX MEMORY — zachowaj historię
        if: always()
        uses: actions/cache/save@v4
        with:
          path: rx-memory-cache/history.json
          key: rx-signal-memory-${{ github.run_id }}
      - name: RX QUEEN AI 2.0 — testuj kierowanie zadań
        if: always()
        run: node tests/rx-queen-ai-bridge.cjs
      - name: RX QUEEN AI 2.0 — zaplanuj zadania mrówek
        if: always()
        run: node rx-queen-ai-bridge.cjs
      - name: RX MRÓWKI — sprawdź katalog programów
        if: always()
        run: node tests/rx-programs-catalog.cjs
      - name: RX MRÓWKI — zaplanuj kolejne zadania
        if: always()
        run: node rx-ant-task-board.cjs
      - name: RX ANT BUILDER — przygotuj zadania budowy bez wdrażania
        if: always()
        run: node rx-ant-builder.cjs
      - name: RX ANT BUILDER — test szkiców i bezpieczeństwa
        if: always()
        run: node tests/rx-ant-builder.cjs
      - name: RX QUEEN — raport nocnej zmiany
        if: always()
        env:
          RX_JOB_STATUS: ${{ job.status }}
          RX_RUN_ID: ${{ github.run_id }}
        run: |
          node -e 'const fs=require("node:fs");const p="rx-bibi-reports/rx-ant-lab.json";let report=null;try{report=JSON.parse(fs.readFileSync(p,"utf8"))}catch{}const lines=["## 🐜 RX QUEEN — raport mrówek","- Testy całego zadania: **"+process.env.RX_JOB_STATUS+"**","- Numer uruchomienia: "+process.env.RX_RUN_ID,report?"- Eksperyment syntetyczny: "+report.passingVariants+"/"+report.testedVariants+" wariantów spełniło kryterium":"- Eksperyment syntetyczny: brak raportu","- Dane: syntetyczne; nie oznacza treningu modelu AI ani zapisu DNA do chmury."];fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n")'
      - name: RX BLACK BOX — raport uruchomienia
        if: always()
        env:
          RX_RUN_ID: ${{ github.run_id }}
          RX_SHA: ${{ github.sha }}
          RX_REPO: ${{ github.repository }}
          RX_WORKFLOW: ${{ github.workflow }}
          RX_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p rx-bibi-reports
          node -e 'const fs=require("node:fs");const e=process.env;const report={schema:1,kind:"rx-black-box-ci",repository:e.RX_REPO,workflow:e.RX_WORKFLOW,runId:e.RX_RUN_ID,commit:e.RX_SHA,jobStatus:e.RX_JOB_STATUS,recordedAt:new Date().toISOString(),note:"CI job metadata; see GitHub Actions for per-step outcomes"};fs.writeFileSync("rx-bibi-reports/rx-black-box-run.json",JSON.stringify(report,null,2))'
      - name: RX QUEEN — wspólny raport istniejących silników
        if: ${{ always() }}
        env:
          RX_JOB_STATUS: ${{ job.status }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const dir='rx-bibi-reports';
          const read=(name)=>{try{return JSON.parse(fs.readFileSync(dir+'/'+name,'utf8'))}catch{return null}};
          const chat=read('rx-client-auth-e2e.json');
          const dialogue=read('rx-dialogue-tests.json');
          const memory=read('rx-signal-memory.json');
          const blackbox=read('rx-black-box-run.json');
          const fast=read('rx-fast-test-engine.json');
          const verified=chat?.clientChatVerified===true&&chat?.status==='PASS';
          const report={schema:1,kind:'rx-queen-unified-test-report',jobStatus:process.env.RX_JOB_STATUS,
            authenticatedChat:{status:verified?'VERIFIED':chat?.status||'NOT_RUN',verified,turns:chat?.turns?.length||0},
            localDialogue:{status:dialogue?dialogue.summary?.failedScenarios===0?'PASS':'FAIL':'NOT_RUN',scenarios:dialogue?.summary?.scenarios??null,failed:dialogue?.summary?.failedScenarios??null},
            recurringSignals:{status:memory?'RECORDED':'NOT_RUN',count:memory?.recurring?.length??null},
            fastEngine:{status:fast?'RECORDED':'SEE_STEP_LOGS'},
            blackBox:{status:blackbox?'RECORDED':'NOT_RUN',runId:blackbox?.runId||null}};
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(dir+'/rx-queen-unified-test-report.json',JSON.stringify(report,null,2)+'\n');
          const lines=['### 👑 RX QUEEN — wspólny raport','',
            '- Zalogowany czat: **'+report.authenticatedChat.status+'** ('+report.authenticatedChat.turns+' rozmów)',
            '- Rozmowy lokalne: **'+report.localDialogue.status+'** ('+(report.localDialogue.scenarios??'?')+' scenariuszy)',
            '- RX MEMORY: **'+report.recurringSignals.status+'** ('+(report.recurringSignals.count??'?')+' powracających sygnałów)',
            '- RX FAST: **'+report.fastEngine.status+'**',
            '- RX BLACK BOX: **'+report.blackBox.status+'**',
            '- Testy mock i lokalne nie potwierdzają prawdziwego zalogowanego czatu.'];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log('RX QUEEN unified verdict:',JSON.stringify(report));
          NODE
      - name: RX BIBI — trening kandydatów i ocena na niewidzianych przykładach
        if: ${{ !cancelled() }}
        run: node tests/rx-learning-gate.cjs
      - name: RX BIBI — test agent managera
        if: ${{ !cancelled() }}
        run: node --test tests/rx-agent-manager.test.cjs
      - name: Zachowaj raporty i zrzuty
        if: always()
        uses: actions/upload-artifact@v6
        with:
