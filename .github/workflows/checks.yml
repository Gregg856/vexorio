name: VEXORIO checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify RX Developer browser/core parity before merge
        run: node tests/rx-developer-parity.cjs
      - name: Stage static assets for RX CLOUD smoke test
        run: |
          mkdir -p public
          find . -maxdepth 1 -type f -name '*.html' -exec cp -t public/ -- {} +
          cp -- manifest.webmanifest public/
          test -s public/index.html
          test -s public/manifest.webmanifest
      - name: Check inline JavaScript and core UI
        run: |
          node tests/smoke.cjs
          node tests/push-service-worker.test.cjs
          node tests/rx-direct.cjs
          node tests/rx-cloud-server.cjs
          node tests/rx-bibi-introduction-regression.cjs
          node tests/rx-queen-identity-604.cjs
          node tests/rx-queen-loopback-609.cjs
          node tests/rx-queen-runtime-610.cjs
          node tests/rx-queen-install-611.cjs
          node tests/rx-queen-live-probe-612.cjs
          node tests/rx-queen-host-613.cjs
          node tests/rx-queen-bridge-e2e-614.cjs
          node tests/rx-queen-natural-chat-615.cjs
          node tests/rx-queen-panel-feedback-616.cjs
          node tests/rx-queen-service-staging-617.cjs
          node tests/rx-chat-planner.mjs
          node tests/rx-world-knowledge.mjs
          node tests/rx-knowledge-base.mjs
          node tests/rx-persistent-memory.mjs
          node tests/rx-chat-panel-contract.cjs
          node tests/rx-chat-worker-e2e.cjs
          node tests/rx-bibi-task-store.test.cjs
          node tests/rx-bibi-chat-task-integration.test.cjs
          node tests/rx-bibi-github-evidence-chat.test.cjs
          node tests/rx-bibi-real-brain.test.cjs
          node tests/rx-bibi-evaluator.test.cjs
          node tests/rx-bibi-live-evaluation.test.cjs
          node tests/rx-queen-handoff.mjs
          node tests/rx-queen-approval.mjs
          node tests/rx-queen-queue.mjs
          node tests/rx-queen-report.mjs
          node tests/rx-queen-history.mjs
          node tests/rx-queen-history-export.mjs
          node tests/rx-queen-cloud.mjs
          node tests/rx-queen-panel.mjs
          node tests/rx-queen-isolation.mjs
          node tests/rx-ai-builder.cjs
          node tests/rx-verified-dataset.cjs
          node tests/rx-evaluator.cjs
          node tests/rx-neuron-v2.cjs
          node tests/rx-error-learner.cjs
          node tests/rx-brain-memory.cjs
          node tests/rx-neuron-v21.cjs
          node tests/rx-language-tokenizer.cjs
          node tests/rx-language-seed.cjs
          node tests/rx-text-learner.cjs
          node tests/rx-text-evaluation.cjs
          node tests/rx-text-training-benchmark.cjs
          node tests/rx-text-training-candidate.cjs
          node rx-text-evaluation.cjs
          node --test tests/rx-nauka-4-3.test.cjs tests/rx-nauka-4-3-response.test.cjs tests/rx-nauka-4-3-engine.test.cjs tests/rx-nauka-4-4.test.cjs tests/rx-nauka-4-5-api-contract.test.cjs tests/rx-nauka-4-6-api-adapter.test.cjs tests/rx-nauka-4-7-worker-route.test.cjs
          node --test tests/rx-nauka-4-9-worker-brain-e2e.test.cjs
          node --test tests/rx-nauka-5-2-teach.test.cjs
          node --test tests/rx-queen-training-selection.test.cjs
          node --test tests/rx-queen-train-batch.test.cjs
