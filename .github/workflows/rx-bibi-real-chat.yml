name: RX BIBI REAL CHAT — independent production tester

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: rx-bibi-real-chat
  cancel-in-progress: false

jobs:
  live-chat:
    name: RX BIBI — real authenticated two-turn conversation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test actual production chat (not mocked)
        env:
          RX_BIBI_TEST_ACCESS_TOKEN: ${{ secrets.RX_BIBI_TEST_ACCESS_TOKEN }}
        run: node tests/rx-bibi-real-chat.cjs
