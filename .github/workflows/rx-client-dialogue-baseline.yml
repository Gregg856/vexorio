name: RX BIBI — szybki test rozmów klientów
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rx-chat-planner.mjs'
      - 'rx-task-catalog.cjs'
      - 'rx-math-core.cjs'
      - 'tests/rx-client-dialogue-baseline.cjs'
      - 'tests/rx-client-name-memory.mjs'
      - 'tests/rx-bibi-auto-dialogue.mjs'
      - 'rx-queen-developer-queue.cjs'
      - 'tests/rx-tester-developer-bridge.cjs'
      - 'tests/rx-client-knowledge-regex.cjs'
      - 'tests/rx-client-knowledge-format.cjs'
      - 'tests/rx-client-knowledge-followup.cjs'
      - 'tests/rx-client-knowledge-followup-behavior.cjs'
      - 'rx-world-knowledge.mjs'
      - 'worker.js'
      - '.github/workflows/rx-client-dialogue-baseline.yml'
jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sprawdź istniejące testy rozmów i kontekstu
        run: node tests/rx-chat-planner.mjs
      - name: Sprawdź rozpoznawanie pytań o wiedzę
        run: node tests/rx-client-knowledge-regex.cjs
      - name: Sprawdź format odpowiedzi RX WIEDZA ŚWIATA
        run: node tests/rx-client-knowledge-format.cjs
      - name: Sprawdź bezpieczne pytania uzupełniające
        run: node tests/rx-client-knowledge-followup.cjs
      - name: Sprawdź zachowanie kontekstu na prawdziwych przykładach
        run: node tests/rx-client-knowledge-followup-behavior.cjs
      - name: Sprawdź pamięć imienia w rozmowie klienta
        run: node tests/rx-client-name-memory.mjs
      - name: RX Tester — automatyczne rozmowy wieloetapowe
        id: dialogue_tester
        continue-on-error: true
        run: node tests/rx-bibi-auto-dialogue.mjs
      - name: RX Nauczyciel — pokaż priorytety ćwiczeń z RX Testera
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync('rx-bibi-auto-dialogue.json','utf8'));
          const areas=Array.isArray(report.recommendedPractice)?report.recommendedPractice:[];
          const lines=['## RX Nauczyciel — priorytety rozmów','','Źródło: lokalny RX Tester (nie czat produkcyjny).',''];
          if(!areas.length)lines.push('Brak niezaliczonych unikalnych pytań w bieżącej próbie.');
          else for(const area of areas)lines.push('- '+area.scenario+': '+area.failedUniqueQuestions+' unikalnych błędnych pytań — wymaga przeglądu');
          lines.push('','Rekomendacje nie są automatycznym treningiem modelu.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\\n')+'\\n');
          console.log(lines.join('\\n'));
          NODE
      - name: RX Developer — podsumuj wykryte problemy w GitHub Actions
        run: |
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("rx-bibi-developer-queue.json","utf8"));const counts={};for(const x of r.items)counts[x.type]=(counts[x.type]||0)+1;const lines=["## RX BIBI — problemy do przeglądu","","Liczba zgłoszeń: "+r.count,"",...Object.entries(counts).map(([type,n])=>"- "+type+": "+n),"","Pełna kolejka: artefakt rx-client-dialogue-baseline / rx-bibi-developer-queue.json"];fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");console.log(lines.join("\n"));'
      - name: RX Developer — sprawdź most z testera
        run: node tests/rx-tester-developer-bridge.cjs
      - name: RX Tester → RX Developer — automatyczny odbiór kolejki
        run: |
          node -e 'const fs=require("node:fs");const {buildDialogueDeveloperReviews}=require("./rx-queen-developer-queue.cjs");const queue=JSON.parse(fs.readFileSync("rx-bibi-developer-queue.json","utf8"));const review=buildDialogueDeveloperReviews(queue);fs.writeFileSync("rx-bibi-developer-reviews.json",JSON.stringify(review,null,2)+"\n");console.log("RX Developer reviews:",review.reviews.length,"Auto-fixes:",review.autoFixesApplied);'
      - name: RX Developer — zweryfikuj propozycje z wynikami testera
        run: |
          node -e 'const fs=require("node:fs");const report=JSON.parse(fs.readFileSync("rx-bibi-auto-dialogue.json","utf8"));const reviews=JSON.parse(fs.readFileSync("rx-bibi-developer-reviews.json","utf8"));const checked=reviews.reviews.map(r=>{const matches=report.results.filter(x=>x.message===r.question);return {...r,verification:{status:matches.length?"observed-in-test":"not-reproduced",matchingCases:matches.length,failedCases:matches.filter(x=>!x.pass).length,patchVerified:false}}});const result={schema:1,kind:"rx-dialogue-verification",checked:checked.length,verifiedPatches:0,items:checked};fs.writeFileSync("rx-bibi-verification.json",JSON.stringify(result,null,2)+"\n");console.log("RX Developer verified issue references:",checked.length,"patches verified:",0);'
      - name: Zmierz rozmowy klientów BIBI
        run: node tests/rx-client-dialogue-baseline.cjs > rx-client-dialogue-baseline.json
      - name: Pokaż podsumowanie
        run: |
          node -e 'const r=require("./rx-client-dialogue-baseline.json");console.log("Rozmowy:",r.cases,"Ograniczenia:",r.unsupportedOrLimited,"Model językowy:",r.languageModel)'
      - name: RX Tester — zachowaj status nieudanych rozmów
        if: steps.dialogue_tester.outcome == 'failure'
        run: |
          echo 'RX Tester detected failed dialogue assertions; reports were generated and processed above.'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rx-client-dialogue-baseline
          path: |
            rx-client-dialogue-baseline.json
            rx-bibi-auto-dialogue.json
            rx-bibi-developer-queue.json
            rx-bibi-developer-reviews.json
            rx-bibi-verification.json
          retention-days: 7
