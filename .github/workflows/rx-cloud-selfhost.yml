name: RX CLOUD self-host smoke tests
on:
  push:
    paths:
      - 'rx-cloud-server.cjs'
      - 'rx-money-engine.cjs'
      - 'tests/rx-money-engine.cjs'
      - 'tests/rx-cloud-server.cjs'
      - 'tests/rx-bibi-loopback-e2e.test.cjs'
      - 'tests/rx-bibi-evaluator.cjs'
      - 'tests/rx-bibi-evaluator.test.cjs'
      - 'tests/rx-bibi-live-evaluation.cjs'
      - 'tests/rx-bibi-live-evaluation.test.cjs'
      - 'tests/rx-bibi-real-brain.test.cjs'
      - 'rx-bibi-local-chat-adapter.cjs'
      - 'rx-brain-chat-engine.cjs'
      - 'rx-bibi-task-store.cjs'
      - 'tests/rx-bibi-task-store.test.cjs'
      - 'tests/rx-bibi-chat-task-integration.test.cjs'
      - 'tests/rx-brain-chat-engine.cjs'
      - 'tests/rx-bibi-learning-cases.json'
      - 'tests/rx-cloud-migration-readiness.cjs'
      - 'deploy/RX-CLOUD-WINDOWS.md'
      - 'deploy/rxcloud-windows-preflight.ps1'
      - 'deploy/rxcloud-windows-start.ps1'
      - 'tests/rx-cloud-staged.cjs'
      - 'tests/rx-cloud-modules.cjs'
      - 'tests/rx-cloud-package.cjs'
      - 'tests/rx-cloud-queen-panel.cjs'
      - 'rx-admin-prototype.html'
      - 'worker.js'
      - 'public/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'deploy/Caddyfile.rxcloud.example'
      - 'deploy/rxcloud.service'
      - 'deploy/rxcloud-preflight.sh'
      - 'deploy/rxcloud-install.sh'
      - 'tests/rx-cloud-install.cjs'
      - 'deploy/rxcloud.env.example'
      - 'tests/rx-cloud-preflight.cjs'
      - 'scripts/rx-cloud-health.cjs'
      - '.github/workflows/rx-cloud-selfhost.yml'
  pull_request:
    paths:
      - 'rx-cloud-server.cjs'
      - 'tests/rx-cloud-server.cjs'
      - 'tests/rx-bibi-loopback-e2e.test.cjs'
      - 'tests/rx-bibi-evaluator.cjs'
      - 'tests/rx-bibi-evaluator.test.cjs'
      - 'tests/rx-bibi-live-evaluation.cjs'
      - 'tests/rx-bibi-live-evaluation.test.cjs'
      - 'tests/rx-bibi-real-brain.test.cjs'
      - 'rx-bibi-local-chat-adapter.cjs'
      - 'rx-brain-chat-engine.cjs'
      - 'rx-bibi-task-store.cjs'
      - 'tests/rx-bibi-task-store.test.cjs'
      - 'tests/rx-bibi-chat-task-integration.test.cjs'
      - 'tests/rx-brain-chat-engine.cjs'
      - 'tests/rx-bibi-learning-cases.json'
      - 'tests/rx-cloud-modules.cjs'
      - 'tests/rx-cloud-package.cjs'
      - 'worker.js'
      - 'public/**'
      - 'deploy/rxcloud-preflight.sh'
      - 'deploy/rxcloud-install.sh'
      - 'tests/rx-cloud-install.cjs'
      - 'deploy/rxcloud.env.example'
      - 'tests/rx-cloud-preflight.cjs'
      - '.github/workflows/rx-cloud-selfhost.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rx-cloud-selfhost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: Node 22 RX CLOUD HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test RX BIBI supervised evaluator
        run: node tests/rx-bibi-evaluator.test.cjs
      - name: Test RX BIBI local chat adapter
        run: node tests/rx-bibi-live-evaluation.test.cjs
      - name: Evaluate existing RX BIBI brain baseline
        run: node tests/rx-bibi-real-brain.test.cjs
      - name: RX brain intent regression
        run: node tests/rx-brain-chat-engine.cjs
      - name: RX BIBI persistent task register
        run: node tests/rx-bibi-task-store.test.cjs
      - name: RX BIBI local chat task integration
        run: node tests/rx-bibi-chat-task-integration.test.cjs
      - name: Check syntax
        run: |
          node --check rx-cloud-server.cjs
          node --check tests/rx-cloud-server.cjs
          node --check tests/rx-cloud-staged.cjs
      - name: Test staged installer safety and dry-run
        run: node tests/rx-cloud-install.cjs
      - name: Test VPS preflight safety and syntax
        run: node tests/rx-cloud-preflight.cjs
      - name: Test Queen panel monitoring states
        run: node tests/rx-cloud-queen-panel.cjs
      - name: Check RX module integration contracts
        run: node tests/rx-cloud-modules.cjs
      - name: RX CLOUD 5.3 offer and approval safety checks
        run: node tests/rx-money-engine.cjs
      - name: RX CLOUD 4.0 offline release gate
        run: node tests/rx-cloud-package.cjs
      - name: Validate deployment templates
        run: |
          grep -q 'Restart=on-failure' deploy/rxcloud.service
          grep -q 'reverse_proxy 127.0.0.1:8787' deploy/Caddyfile.rxcloud.example
          grep -q 'health_uri /__rxcloud/health' deploy/Caddyfile.rxcloud.example
      - name: Stage VEXORIO static assets for local self-host test
        run: |
          mkdir -p public
          find . -maxdepth 1 -type f -name '*.html' -exec cp -t public/ -- {} +
          cp -- manifest.webmanifest public/
          cp -- *.js public/
          test -s public/index.html
          test -s public/manifest.webmanifest
      - name: Check migration readiness (offline, Windows plan)
        run: node tests/rx-cloud-migration-readiness.cjs
      - name: Run RX CLOUD smoke tests
        run: node tests/rx-cloud-server.cjs
      - name: Test local model inference transport
        run: node --test tests/rx-bibi-loopback-e2e.test.cjs
      - name: Test isolated RX CLOUD installation layout
        run: node tests/rx-cloud-staged.cjs
      - name: Validate monitor failure reporting (no live server)
        run: |
          if RX_CLOUD_HEALTH_URL=http://127.0.0.1:1/__rxcloud/health RX_CLOUD_REPORT_PATH=/tmp/rx-cloud-health.json node scripts/rx-cloud-health.cjs; then
            echo 'Monitor incorrectly accepted unavailable server'; exit 1
          fi
          node -e "const r=require('/tmp/rx-cloud-health.json'); if(r.status!=='error'||r.kind!=='rx-cloud-health') process.exit(1)"
