name: RX ALARM — GitHub notifications
on:
  workflow_run:
    workflows:
      - VEXORIO checks
      - Deploy VEXORIO
      - RX BIBI Tester — mobile browser
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report failed workflow without duplicate issues
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = 'RX ALARM: ' + run.name + ' — błąd testu';
            const marker = '<!-- rx-alarm-workflow:' + run.workflow_id + ' -->';
            const {owner, repo} = context.repo;
            const {data: issues} = await github.rest.issues.listForRepo({owner, repo, state:'open', per_page:100});
            const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
            const body = marker + '\n⚠️ **RX wykrył czerwony test.**\n\n' +
              '**Proces:** ' + run.name + '\n' +
              '**Uruchomienie:** #' + run.run_number + '\n' +
              '**Wynik:** ' + run.conclusion + '\n' +
              '**Szczegóły:** ' + run.html_url + '\n\n' +
              'RX tylko zgłasza problem. Nie zmienia kodu ani nie publikuje napraw.';
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number:existing.number, body});
              await github.rest.issues.createComment({owner, repo, issue_number:existing.number,
                body:'Nowy błąd w uruchomieniu #' + run.run_number + ': ' + run.html_url});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
