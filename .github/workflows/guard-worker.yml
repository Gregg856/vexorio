name: Strazak GitHub Worker — safe audit
on:
  schedule:
    - cron: '17 5 * * *'
  pull_request:
    paths:
      - 'guard-*.js'
      - 'guard/**'
      - 'tests/guard-*'
      - '.github/workflows/guard-worker.yml'
  workflow_dispatch:
    inputs:
      proposal_file:
        description: 'Optional guard-*.js file for read-only patch proposal'
        required: false
        type: string
      scope:
        description: 'Audit scope'
        required: true
        type: choice
        options:
          - guard
          - site
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pull request change boundaries
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const allowed = name =>
              /^guard-[a-z0-9-]+\.js$/.test(name) ||
              /^guard\/[a-z0-9_-]+(?:\/[a-z0-9_-]+)*\.(?:cjs|js)$/.test(name) ||
              /^tests\/guard-[a-z0-9-]+\.test\.(?:cjs|js)$/.test(name);
            const blocked = files.filter(f => !allowed(f.filename)).map(f => f.filename);
            if (blocked.length) core.setFailed('Strażak PR cannot change other files: ' + blocked.join(', '));
            else core.info('PASS: ' + files.length + ' Strażak files only. Review and merge remain manual.');
      - name: Scheduled guard audit checks
        if: github.event_name == 'schedule'
        run: |
          set -eu
          node --check guard-chat.js
          node --check guard-code-audit-plugin.js
          node --check guard-github-panel.js
          node tests/guard-chat.test.cjs
          node tests/guard-plugin-core.test.cjs
          node tests/guard-developer-inspector.test.cjs
          node tests/guard-developer-security-rules.test.cjs
          node tests/guard-developer-runtime.test.cjs
      - name: Check syntax and tests
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.scope }}" = "guard" ]; then
            node --check guard-chat.js
            node --check guard-code-ui.js
            node --check guard-code-fix.js
            node --check guard-patch-preview.js
            node --check guard-github-panel.js
            node tests/guard-code-fix.test.cjs
            node tests/guard-patch-preview.test.cjs
            node tests/guard-prepare-safe-fix.test.cjs
            node tests/guard-developer-inspector.test.cjs
          else
            node --check worker.js
            node --check guard-chat.js
            node tests/search-location-regression.test.js
          fi
      - name: Generate scheduled read-only patch suggestions
        if: github.event_name == 'schedule'
        run: |
          set -eu
          mkdir -p strazak-proposals
          for target in guard-chat.js guard-github-panel.js guard-code-ui.js guard-code-fix.js; do
            node guard/patch-proposal.cjs "$target"
            mv strazak-patch-proposal.txt "strazak-proposals/${target}.txt"
          done
          echo 'Propozycje zmian (bez zapisu do repozytorium):' >> "$GITHUB_STEP_SUMMARY"
          for report in strazak-proposals/*.txt; do
            head -n 3 "$report" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload scheduled patch suggestions
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: strazak-daily-proposals
          path: strazak-proposals/
          retention-days: 7
      - name: Prepare patch proposal artifact
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'guard' && inputs.proposal_file != ''
        env:
          PROPOSAL_FILE: ${{ inputs.proposal_file }}
        run: node guard/patch-proposal.cjs "$PROPOSAL_FILE"
      - name: Upload patch proposal
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'guard' && inputs.proposal_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: strazak-patch-proposal
          path: strazak-patch-proposal.txt
          retention-days: 7
      - name: Save audit report
        if: always()
        env:
          AUDIT_RESULT: ${{ job.status }}
          AUDIT_EVENT: ${{ github.event_name }}
          AUDIT_SCOPE: ${{ inputs.scope }}
        run: |
          set -eu
          {
            echo 'Strażak GitHub Worker — raport automatycznego audytu'
            echo "Wynik: $AUDIT_RESULT"
            echo "Tryb: $AUDIT_EVENT"
            echo "Zakres: ${AUDIT_SCOPE:-guard}"
            echo "Commit: $GITHUB_SHA"
            echo "Szczegóły: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ "$AUDIT_RESULT" = success ]; then
              echo 'Rekomendacja: brak nieudanych kroków w tym uruchomieniu; nie oznacza to braku wszystkich błędów.'
            else
              echo 'Rekomendacja: sprawdź nieudane kroki w logach GitHub Actions przed przygotowaniem poprawki.'
            fi
            echo 'Zmiany w kodzie: brak. Publikacja: brak. Scalanie PR: brak.'
          } > strazak-audit.txt
          cat strazak-audit.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strazak-audit
          path: strazak-audit.txt
          retention-days: 7
