name: RX BIBI curriculum tests
on:
  pull_request:
    paths:
      - 'tests/rx-queen-writing-reviewed-batch.cjs'
      - 'tests/rx-queen-writing-reviewed-batch.test.cjs'
      - 'tests/rx-queen-writing-examiner.cjs'
      - 'tests/rx-queen-writing-examiner.test.cjs'
      - 'tests/rx-queen-writing-heldout.cjs'
      - 'tests/rx-queen-writing-heldout.test.cjs'
      - 'tests/rx-queen-semantic-gap.cjs'
      - 'tests/rx-queen-semantic-gap.test.cjs'
      - 'tests/rx-queen-writing-composer.cjs'
      - 'tests/rx-queen-writing-variants.test.cjs'
      - 'tests/rx-queen-intent-parser.cjs'
      - 'tests/rx-queen-intent-parser.test.cjs'
      - 'tests/rx-queen-combined-constraints.test.cjs'
      - 'tests/rx-queen-conflict-guard.test.cjs'
      - 'tests/rx-bibi-manager-writing-route.test.cjs'
      - 'rx-bibi-manager.html'
      - '.github/workflows/rx-bibi-learning.yml'
      - '.github/workflows/rx-bibi-curriculum-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/rx-queen-writing-reviewed-batch.cjs
      - run: node --check tests/rx-queen-writing-examiner.cjs
      - run: node --check tests/rx-queen-writing-heldout.cjs
      - run: node --test tests/rx-queen-writing-reviewed-batch.test.cjs tests/rx-queen-writing-examiner.test.cjs tests/rx-queen-writing-heldout.test.cjs
      - run: node --check tests/rx-queen-intent-parser.cjs
      - run: node --test tests/rx-queen-semantic-gap.test.cjs tests/rx-queen-writing-variants.test.cjs tests/rx-queen-intent-parser.test.cjs tests/rx-queen-combined-constraints.test.cjs tests/rx-queen-conflict-guard.test.cjs
      - run: node --test tests/rx-bibi-manager-writing-route.test.cjs
      - run: node tests/rx-queen-writing-heldout.cjs
      - run: node tests/rx-queen-semantic-gap.cjs
