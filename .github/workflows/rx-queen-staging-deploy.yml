name: RX Queen isolated staging deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rx-queen-staging-deploy
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    environment: rx-queen-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rx-queen-worker-queue-read
          persist-credentials: false
      - name: Confirm RX Queen code is present
        run: |
          grep -Fq '/api/rx/ants/tasks' worker.js || { echo '::error::RX Queen queue route missing'; exit 1; }
          grep -Fq '/api/rx/chat' worker.js || { echo '::error::RX Queen chat route missing'; exit 1; }
      - name: Require isolated staging configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_ANON: ${{ secrets.RX_STAGING_SUPABASE_ANON_KEY }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" && test -n "$STAGING_ANON" || {
            echo "::error::Missing Cloudflare or staging-only Supabase credentials"
            exit 1
          }
      - name: Przygotuj strone
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp guard-lab.html public/guard-lab.html
          cp rx-bibi-manager.html public/rx-bibi-manager.html
          cp rx-admin-prototype.html public/rx-admin-prototype.html
          cp rx-center.html public/rx-center.html
          test -s public/rx-center.html
          test -s public/rx-admin-prototype.html
          mkdir -p public/guard
          cp guard/rx-developer-core-browser.js public/guard/rx-developer-core-browser.js
          test -s public/guard/rx-developer-core-browser.js
          cp rx-bibi-studio.html public/rx-bibi-studio.html
          cp rx-ai-director.js public/rx-ai-director.js
          cp rx-video-engine.js public/rx-video-engine.js
          cp rx-photo-motion.js public/rx-photo-motion.js
          test -s public/rx-bibi-studio.html
          cp rx-bibi-tester-status.js public/rx-bibi-tester-status.js
          test -s public/rx-bibi-manager.html
          grep -Eq 'RX BIBI Manager 1\.[0-9]+' public/rx-bibi-manager.html
          cp guard-lab.js public/guard-lab.js
          # RX Queen is loaded by guard-lab.html; ship it with the static assets.
          cp guard-rx-queen-panel.js public/guard-rx-queen-panel.js
          test -s public/guard-rx-queen-panel.js
          cp rx-direct-inbox.json public/rx-direct-inbox.json
          test -s public/rx-direct-inbox.json
          cp guard-rx-conversation.js public/guard-rx-conversation.js
          cp guard-rx-orchestrator.js public/guard-rx-orchestrator.js
          cp guard-rx-browser.js public/guard-rx-browser.js
          cp guard-rx-monitor-report.js public/guard-rx-monitor-report.js
          cp guard-rx-categories.js public/guard-rx-categories.js
          cp rx-screen-recorder.html public/rx-screen-recorder.html
          cp rx-screen-recorder.js public/rx-screen-recorder.js
          test -s public/rx-screen-recorder.html
          test -s public/rx-screen-recorder.js
          cp guard-rx-programs.js public/guard-rx-programs.js
          test -s public/guard-rx-programs.js
          cp guard-install.js public/guard-install.js
          cp guard-github-panel.js guard-changes-report-plugin.js guard-tabs.js guard-chat.js guard-code-audit-plugin.js guard-commands.js guard-task-queue.js guard-engine-2.js guard-capabilities.js guard-icon.svg public/
          cp guard/plugin-core.cjs public/guard-plugin-core.js
          cp guard-task-analyzer-plugin.js public/guard-task-analyzer-plugin.js
          cp guard/developer-inspector.cjs public/guard-developer-inspector.js
          cp guard/developer-diff.cjs public/guard-developer-diff.js
          cp guard-code-ui.js guard-code-fix.js guard-patch-preview.js public/
          cp guard-manifest.webmanifest public/guard-manifest.webmanifest
          # Embed the exact GitHub revision in the deployed HTML for release verification.
          sed -i "s#</head>#<meta name=\"vexorio-deploy-sha\" content=\"${GITHUB_SHA}\"></head>#" public/index.html
          cp push-sw.js public/push-sw.js
          cp manifest.webmanifest public/manifest.webmanifest
          cp vexorio-app-icon.svg public/vexorio-app-icon.svg
          cp robots.txt public/robots.txt
          cp _headers public/_headers
      - name: Write isolated staging Worker configuration
        env:
          STAGING_ANON: ${{ secrets.RX_STAGING_SUPABASE_ANON_KEY }}
        run: |
          cat > wrangler.toml <<'EOF'
          name = "vexorio-staging"
          compatibility_date = "2026-10-20"
          workers_dev = true
          main = "./worker.js"
          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = true
          [ai]
          binding = "AI"
          [vars]
          VIEW_COUNT_ENABLED = "false"
          SUPABASE_URL = "https://owkjdlpawczrnwyszduj.supabase.co"
          EOF
          printf '\nSUPABASE_ANON_KEY = "%s"\n' "$STAGING_ANON" >> wrangler.toml
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Deploy isolated staging only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          command: deploy
      - name: Verify isolated staging URL
        run: |
          echo "Staging Worker name: vexorio-staging" >> "$GITHUB_STEP_SUMMARY"
          echo "Production Worker vexorio was not deployed." >> "$GITHUB_STEP_SUMMARY"
