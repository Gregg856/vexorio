name: RX BIBI Dashboard Summary — isolated CI
on:
  pull_request:
    paths:
      - 'rx-bibi-dashboard-summary.cjs'
      - 'tests/rx-bibi-dashboard-summary.cjs'
      - '.github/workflows/rx-bibi-dashboard-summary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check rx-bibi-dashboard-summary.cjs
          node --check tests/rx-bibi-dashboard-summary.cjs
      - name: Test summary
        run: node tests/rx-bibi-dashboard-summary.cjs
