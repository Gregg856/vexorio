name: RX Queen gateway contract
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  pull_request:
    paths:
      - 'rx/autopraca/edge-functions/rx-queen-private-queue/**'
      - 'tests/rx-queen-gateway-contract.cjs'
      - '.github/workflows/rx-queen-gateway-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/rx-queen-gateway-contract.cjs

  live-staging-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed staging Queen gateway rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          url='https://owkjdlpawczrnwyszduj.supabase.co/functions/v1/rx-queen-private-queue'
          response="$(mktemp)"
          status="$(curl --silent --show-error --location --max-time 15 --output "$response" --write-out '%{http_code}' --request GET "$url")"
          if [ "$status" != 401 ]; then
            echo "::error::Staging Queen gateway returned HTTP $status instead of 401"
            exit 1
          fi
          # Supabase's gateway can reject missing JWTs before Edge Function code runs.
          # Either gateway 401 or function 401 is the desired unauthenticated denial.
          echo "Staging Queen gateway denied unauthenticated GET (HTTP 401)."
          {
            echo "### RX Queen — live staging check"
            echo "- Unauthenticated GET: HTTP 401 (expected)"
            echo "- Private data exposure: no unauthenticated read"
            echo "- Authenticated database read: not tested (requires admin session)"
            echo "- Production: not contacted"
          } >> "$GITHUB_STEP_SUMMARY"
