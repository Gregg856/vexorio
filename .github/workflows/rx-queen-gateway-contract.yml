name: RX Queen gateway contract
on:
  pull_request:
    paths:
      - 'rx/autopraca/edge-functions/rx-queen-private-queue/**'
      - 'tests/rx-queen-gateway-contract.cjs'
      - '.github/workflows/rx-queen-gateway-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/rx-queen-gateway-contract.cjs
