name: RX BIBI — learning batch
on:
  workflow_dispatch:
  schedule:
    - cron: '12 */6 * * *'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: rx-bibi-learning-history
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts and metrics store
        run: |
          node --check rx-cloud-server.cjs
          node --check rx-learning-cloud-store.cjs
          node --check tests/rx-learning-cloud-sync.cjs
          node --check tests/rx-autobots-batch.cjs
          node --check tests/rx-autobots-memory-watchdog.cjs
          node --check tests/rx-queen-response-practice.cjs
          node --check tests/rx-queen-writing-composer.cjs
          node --check tests/rx-queen-writing-agent-review.cjs
          node --check tests/rx-queen-response-improvement.cjs
          node --check tests/rx-queen-candidate-selection.cjs
          node --check rx-queen-approved-memory.cjs
          node --check rx-queen-live-memory-gate.cjs
          node --check tests/rx-queen-runtime-readiness.cjs
          node --check tests/rx-queen-writing-reviewed-batch.cjs
          node --test tests/rx-queen-writing-reviewed-batch.test.cjs
          node --test tests/rx-learning-cloud-store.test.cjs tests/rx-learning-memory.test.cjs tests/rx-agent-manager.test.cjs tests/rx-autobots-batch.test.cjs tests/rx-queen-response-practice.test.cjs tests/rx-queen-writing-composer.test.cjs tests/rx-queen-writing-agent-review.test.cjs tests/rx-queen-response-improvement.test.cjs tests/rx-queen-candidate-selection.test.cjs tests/rx-queen-approved-memory.test.cjs tests/rx-queen-memory-chat-bridge.test.cjs tests/rx-queen-live-memory-gate.test.cjs tests/rx-queen-runtime-readiness.test.cjs
      - name: Restore cloud history
        id: cloud
        continue-on-error: true
        env:
          RX_LEARNING_CLOUD_URL: ${{ secrets.RX_LEARNING_CLOUD_URL }}
          RX_QUEEN_LOCAL_TOKEN: ${{ secrets.RX_QUEEN_LOCAL_TOKEN }}
        run: |
          test -n "$RX_LEARNING_CLOUD_URL" && test -n "$RX_QUEEN_LOCAL_TOKEN"
          node tests/rx-learning-cloud-sync.cjs pull
      - name: Restore GitHub history fallback
        if: steps.cloud.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const owner=context.repo.owner,repo=context.repo.repo;
            const title='[RX BIBI MEMORY] Training metrics (no chat data)';
            const found=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const issue=found.data.find(i=>i.title===title);
            if(!issue)return;
            const match=(issue.body||'').match(/<!-- RX_BIBI_HISTORY_START -->([\s\S]*?)<!-- RX_BIBI_HISTORY_END -->/);
            if(!match)return;
            let payload=match[1].trim(); while(payload.startsWith(String.fromCharCode(92)+'n')) payload=payload.slice(2); while(payload.endsWith(String.fromCharCode(92)+'n')) payload=payload.slice(0,-2);
            const data=JSON.parse(payload);
            const {validate}=require('./rx-learning-cloud-store.cjs');
            const safe=validate(data);
            fs.mkdirSync('rx-bibi-reports',{recursive:true});
            fs.writeFileSync('rx-bibi-reports/rx-learning-history.json',JSON.stringify(safe));
      - name: Restore writing curriculum from GitHub Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const {validateHistory}=require('./tests/rx-queen-writing-reviewed-batch.cjs');
            const title='[RX BIBI MEMORY] Writing curriculum keys (no chat data)';
            const {owner,repo}=context.repo;
            const found=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const issue=found.data.find(i=>!i.pull_request&&i.title===title);
            if(!issue)return;
            const match=(issue.body||'').match(/<!-- RX_CURRICULUM_START -->([\\s\\S]*?)<!-- RX_CURRICULUM_END -->/);
            if(!match)throw Error('Missing curriculum markers');
            const safe=validateHistory(JSON.parse(match[1].trim().replace(/^\\n|\\n$/g,'')));
            fs.mkdirSync('rx-bibi-reports',{recursive:true});
            fs.writeFileSync('rx-bibi-reports/rx-queen-writing-curriculum-history.json',JSON.stringify(safe));
      - name: RX MEGA execute existing Queen chat and memory tests
        run: |
          node -e "const r=require('./rx-mega-cloud-computer.cjs').runCloudComputer({execute:true,selectedChecks:['tests/rx-queen-memory-chat-bridge.test.cjs','tests/rx-queen-live-memory-gate.test.cjs']});console.log(JSON.stringify({executed:r.executed,passed:r.passed,failed:r.failed}));if(r.failed||r.passed!==2)process.exitCode=1"
      - name: Run five coordinated RX agent cycles
        run: node tests/rx-autobots-batch.cjs
      - name: Verify Queen writing through existing authenticated chat bridge (offline)
        run: |
          node --test tests/rx-queen-memory-chat-bridge.test.cjs tests/rx-queen-writing-composer.test.cjs tests/rx-queen-writing-agent-review.test.cjs
      - name: Confirm reviewed Queen writing before storing training evidence
        run: |
          node tests/rx-queen-writing-agent-review.cjs
          node -e "const r=require('./tests/rx-queen-writing-agent-review.cjs').review();if(r.status!=='PASS'||r.passed!==r.total||r.productionConnected!==false)process.exit(1);console.log('Reviewed writing cases:',r.passed,'/',r.total)"
      - name: Practice Queen writing and answers
        run: node tests/rx-queen-response-practice.cjs
      - name: Prepare reviewed Queen writing candidates automatically
        run: |
          node --test tests/rx-queen-writing-reviewed-batch.test.cjs
          node tests/rx-queen-writing-reviewed-batch.cjs
      - name: Queen writing agent review
        run: node tests/rx-queen-writing-agent-review.cjs
      - name: Queen response improvement proposals
        run: node tests/rx-queen-response-improvement.cjs
      - name: Compare Queen response candidates
        run: node tests/rx-queen-candidate-selection.cjs
      - name: Verify AutoBots memory continuity
        run: node tests/rx-autobots-memory-watchdog.cjs
      - name: Persist GitHub history fallback
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const {validate}=require('./rx-learning-cloud-store.cjs');
            const data=validate(JSON.parse(fs.readFileSync('rx-bibi-reports/rx-learning-history.json','utf8')));
            const title='[RX BIBI MEMORY] Training metrics (no chat data)';
            const start='<!-- RX_BIBI_HISTORY_START -->',end='<!-- RX_BIBI_HISTORY_END -->';
            const body='Offline training metrics only; no user chat data.\n'+start+'\n'+JSON.stringify(data)+'\n'+end;
            const owner=context.repo.owner,repo=context.repo.repo;
            const found=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const issue=found.data.find(i=>i.title===title);
            if(issue)await github.rest.issues.update({owner,repo,issue_number:issue.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
      - name: Persist writing curriculum to GitHub Issues
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const {validateHistory}=require('./tests/rx-queen-writing-reviewed-batch.cjs');
            const data=validateHistory(JSON.parse(fs.readFileSync('rx-bibi-reports/rx-queen-writing-curriculum-history.json','utf8')));
            const title='[RX BIBI MEMORY] Writing curriculum keys (no chat data)';
            const body='Offline exercise identifiers only; no prompts, answers or private chat data.\n<!-- RX_CURRICULUM_START -->\n'+JSON.stringify(data)+'\n<!-- RX_CURRICULUM_END -->';
            const {owner,repo}=context.repo;
            const found=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const issue=found.data.find(i=>!i.pull_request&&i.title===title);
            if(issue)await github.rest.issues.update({owner,repo,issue_number:issue.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
      - name: Persist cloud history only after verified cloud restore
        if: success() && steps.cloud.outcome == 'success'
        env:
          RX_LEARNING_CLOUD_URL: ${{ secrets.RX_LEARNING_CLOUD_URL }}
          RX_QUEEN_LOCAL_TOKEN: ${{ secrets.RX_QUEEN_LOCAL_TOKEN }}
        run: node tests/rx-learning-cloud-sync.cjs push
      - name: Save training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rx-bibi-learning-gate
          path: rx-bibi-reports/*.json
          if-no-files-found: warn
          retention-days: 14
