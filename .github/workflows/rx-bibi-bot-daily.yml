name: RX BIBI Bot — daily tester summary
on:
  schedule:
    - cron: '42 7 * * *'
  workflow_dispatch:
permissions:
  actions: read
  issues: write
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate recent tester runs without exposing credentials
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const workflows=await github.rest.actions.listRepoWorkflows({owner,repo,per_page:100});
            const wf=workflows.data.workflows.find(w=>w.path==='.github/workflows/rx-bibi-browser.yml');
            if(!wf){core.warning('RX BIBI Tester workflow not found');return;}
            const runs=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:wf.id,per_page:20});
            const recent=runs.data.workflow_runs.filter(r=>r.status==='completed');
            const good=recent.filter(r=>r.conclusion==='success').length;
            const bad=recent.filter(r=>r.conclusion==='failure').length;
            const title='[RX BIBI BOT] Daily tester status';
            const body=[
              'Automatyczny raport ostatnich '+recent.length+' zakończonych testów RX BIBI.',
              '',
              'Zielone: '+good,
              'Czerwone: '+bad,
              'Inne: '+(recent.length-good-bad),
              '',
              ...recent.slice(0,10).map(r=>'- #'+r.run_number+' '+r.conclusion+' '+r.html_url),
              '',
              'Wyniki testów nie są dowodem wdrożenia ani zalogowanego czatu, jeżeli E2E jest zablokowane.'
            ].join('\n');
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            const existing=issues.find(i=>!i.pull_request&&i.title===title);
            if(existing)await github.rest.issues.update({owner,repo,issue_number:existing.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
