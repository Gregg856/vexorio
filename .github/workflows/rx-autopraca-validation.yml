name: RX AUTOPRACA 2.0 validation
on:
  pull_request:
    paths:
      - 'rx/autopraca/**'
      - '.github/workflows/rx-autopraca-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate RX task allowlist
        run: node --test rx/autopraca/task-validation.test.mjs
