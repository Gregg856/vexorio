name: RX ADMIN UI checks
on:
  pull_request:
    paths:
      - 'rx-admin-prototype.html'
      - 'scripts/check-rx-admin-ui.cjs'
      - '.github/workflows/rx-admin-ui-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rx-admin-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate RX ADMIN UI structure and JavaScript
        run: node --test scripts/check-rx-admin-ui.cjs
