name: RX Benchmark 5.0
on:
  push:
    paths:
      - 'rx-benchmark-5-0.cjs'
      - 'guard/rx-developer-core.cjs'
      - 'guard/rx-developer-core-browser.js'
      - '.github/workflows/rx-benchmark-5-0.yml'
  pull_request:
    paths:
      - 'rx-benchmark-5-0.cjs'
      - 'guard/rx-developer-core.cjs'
      - 'guard/rx-developer-core-browser.js'
      - '.github/workflows/rx-benchmark-5-0.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node rx-benchmark-5-0.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rx-benchmark-5-0
          path: rx-bibi-reports/rx-benchmark-5-0.json
          retention-days: 7
