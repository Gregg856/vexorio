name: RX Benchmark 1.0
on:
  pull_request:
    paths:
      - 'rx-benchmark-1-0.cjs'
      - 'guard/rx-developer-core.cjs'
      - '.github/workflows/rx-benchmark-1-0.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 100 deterministic RX audit cases
        run: node rx-benchmark-1-0.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rx-benchmark-1-0
          path: rx-bibi-reports/rx-benchmark-1-0.json
          retention-days: 7
