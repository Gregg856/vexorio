name: Deploy VEXORIO

# Production release is manual: test changes on main before explicit approval.
on:
  workflow_dispatch:

# Prevent an older deployment from overwriting a newer revision.
concurrency:
  group: vexorio-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pobierz poprzedni commit do analizy zmian
        run: git fetch --no-tags --depth=2 origin main

      - name: Przygotuj strone
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp guard-lab.html public/guard-lab.html
          cp rx-bibi-manager.html public/rx-bibi-manager.html
          # Client-only RX BIBI chat is a separate static page, not the VEXORIO homepage.
          cp rx-client.html public/rx-client.html
          cp rx-bibi-mascot.svg public/rx-bibi-mascot.svg
          test -s public/rx-bibi-mascot.svg
          test -s public/rx-client.html
          cp rx-admin-prototype.html public/rx-admin-prototype.html
          cp rx-center.html public/rx-center.html
          test -s public/rx-center.html
          test -s public/rx-admin-prototype.html
          mkdir -p public/guard
          cp guard/rx-developer-core-browser.js public/guard/rx-developer-core-browser.js
          test -s public/guard/rx-developer-core-browser.js
          cp rx-bibi-studio.html public/rx-bibi-studio.html
          cp rx-ai-director.js public/rx-ai-director.js
          cp rx-video-engine.js public/rx-video-engine.js
          cp rx-photo-motion.js public/rx-photo-motion.js
          test -s public/rx-bibi-studio.html
          cp rx-bibi-tester-status.js public/rx-bibi-tester-status.js
          test -s public/rx-bibi-manager.html
          grep -Fq 'RX BIBI Manager — panel Królowej' public/rx-bibi-manager.html
          cp guard-lab.js public/guard-lab.js
          # RX Queen is loaded by guard-lab.html; ship it with the static assets.
          cp guard-rx-queen-panel.js public/guard-rx-queen-panel.js
          test -s public/guard-rx-queen-panel.js
          cp rx-direct-inbox.json public/rx-direct-inbox.json
          test -s public/rx-direct-inbox.json
          cp guard-rx-conversation.js public/guard-rx-conversation.js
          cp guard-rx-orchestrator.js public/guard-rx-orchestrator.js
          cp guard-rx-browser.js public/guard-rx-browser.js
          cp guard-rx-monitor-report.js public/guard-rx-monitor-report.js
          cp guard-rx-categories.js public/guard-rx-categories.js
          cp rx-screen-recorder.html public/rx-screen-recorder.html
          cp rx-screen-recorder.js public/rx-screen-recorder.js
          test -s public/rx-screen-recorder.html
          test -s public/rx-screen-recorder.js
          cp guard-rx-programs.js public/guard-rx-programs.js
          test -s public/guard-rx-programs.js
          cp guard-install.js public/guard-install.js
          cp guard-github-panel.js guard-changes-report-plugin.js guard-tabs.js guard-chat.js guard-code-audit-plugin.js guard-commands.js guard-task-queue.js guard-engine-2.js guard-capabilities.js guard-icon.svg public/
          cp guard/plugin-core.cjs public/guard-plugin-core.js
          cp guard-task-analyzer-plugin.js public/guard-task-analyzer-plugin.js
          cp guard/developer-inspector.cjs public/guard-developer-inspector.js
          cp guard/developer-diff.cjs public/guard-developer-diff.js
          cp guard-code-ui.js guard-code-fix.js guard-patch-preview.js public/
          cp guard-manifest.webmanifest public/guard-manifest.webmanifest
          # Embed the exact GitHub revision in the deployed HTML for release verification.
          sed -i "s#</head>#<meta name=\"vexorio-deploy-sha\" content=\"${GITHUB_SHA}\"></head>#" public/index.html
          cp push-sw.js public/push-sw.js
          cp manifest.webmanifest public/manifest.webmanifest
          cp vexorio-app-icon.svg public/vexorio-app-icon.svg
          cp robots.txt public/robots.txt
          cp _headers public/_headers
          cat > wrangler.toml <<'EOF'
          name = "vexorio"
          compatibility_date = "2026-10-20"
          workers_dev = true
          # Preserve dashboard-managed variables across automated deployments.
          keep_vars = true

          main = "./worker.js"

          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = true

          [ai]
          binding = "AI"

          [vars]
          VIEW_COUNT_ENABLED = "false"
          SUPABASE_URL = "https://lfytoxcnutduahshbsko.supabase.co"
          SUPABASE_ANON_KEY = "sb_publishable_S58StH3HgvtjT1pRw2X3Ug_HiLNwpDz"
          EOF

      - name: Sprawdz skladnie JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m => !/\btype\s*=\s*["']module["']/i.test(m[1])).map(m => m[2]).filter(Boolean);
          for (const [i, script] of scripts.entries()) new vm.Script(script, {filename: `inline-${i+1}.js`});
          for (const id of ['query', 'searchBtn', 'cards', 'myConversations']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing control: ${id}`);
          }
          console.log('PASS: syntax and essential controls');
          NODE

      - name: Sprawdz funkcje logowania, ogloszen i czatu
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const checks = [
            ['Logowanie Supabase', /sb\.auth\.(signInWithPassword|signInWithOAuth)/],
            ['Pobieranie ogloszen', /\.from\(['"]listings['"]\)/],
            ['Wiadomosci', /\.from\(['"]messages['"]\)/],
            ['Rozmowy', /\.from\(['"]conversations['"]\)/],
            ['Formularz ogloszenia', /id=["']addBtn["']/],
            ['Lista rozmow', /id=["']myConversations["']/],
          ];
          for (const [label, pattern] of checks) {
            if (!pattern.test(html)) throw new Error('Missing feature: ' + label);
            console.log('PASS: ' + label);
          }
          NODE

      - name: Testy regresji wyszukiwarki i odleglosci
        run: |
          node tests/search-location-regression.test.js
          node tests/location-radius-fixtures.test.js
          node tests/public-profile-regression.test.js
          node tests/mobile-filter-baseline.test.js
          node tests/prelaunch-critical-paths.test.js
          node tests/production-release-gate.test.js
          node tests/push-service-worker.test.cjs
          node tests/view-endpoint-regression.test.cjs
          node tests/view-endpoint-runtime.test.cjs
          node tests/rx-manager-dispatch.test.cjs
          node tests/guard-fraud-explain.test.cjs
          node tests/guard-report.test.cjs
          node tests/guard-review-priority.test.cjs
          node tests/guard-metrics-summary.test.cjs
          node tests/guard-chat.test.cjs
          node tests/guard-task-queue.test.cjs
          node tests/guard-engine-2.test.cjs
          node tests/guard-capabilities.test.cjs
          node tests/guard-ai-core.test.cjs
          node tests/guard-plugin-core.test.cjs
          node tests/guard-task-analyzer-plugin.test.cjs
          node tests/guard-changes-report-plugin.test.cjs
          node tests/guard-code-fix.test.cjs
          node tests/guard-patch-preview.test.cjs
          node tests/guard-prepare-safe-fix.test.cjs
          node tests/guard-confirmed-fix-memory.test.cjs
          node tests/guard-incident-report.test.cjs
          node tests/rx-bibi-manager.test.cjs
          node tests/guard-fix-pipeline.test.cjs
          node tests/guard-greetings.test.cjs
          node tests/guard-developer-inspector.test.cjs
          node tests/guard-developer-security-rules.test.cjs
          node tests/guard-developer-ui.test.cjs
          node tests/guard-developer-runtime.test.cjs
          node tests/guard-repository-scan.test.cjs
          node tests/guard-repository-summary.test.cjs
          node tests/guard-developer-diff.test.cjs
          node tests/guard-developer-changes.test.cjs
          node tests/guard-engine.test.cjs
          node tests/guard-duplicates.test.cjs
          node tests/guard-images.test.cjs
          node tests/guard-image-features.test.cjs
          node tests/guard-pixel-features.test.cjs
          node tests/guard-image-model.test.cjs
          node tests/guard-spatial-features.test.cjs
          node tests/guard-combined-image-model.test.cjs
          node tests/guard-image-evaluation.test.cjs
          node tests/guard-image-similarity.test.cjs
          node tests/guard-image-pipeline.test.cjs
          node tests/guard-evaluate.test.cjs
          node tests/guard-model-adapter.test.cjs
          node tests/guard-local-model.test.cjs
          node tests/guard-rx-engine.test.cjs
          node tests/guard-rx-browser.test.cjs
          node tests/guard-rx-conversation.test.cjs
          node tests/guard-rx-orchestrator.test.cjs
          node --check guard-rx-browser.js
          grep -q 'guardRxForm' guard-lab.html
          node tests/guard-local-integration.test.cjs
          node tests/guard-metrics.test.cjs
          node tests/guard-dataset-check.test.cjs
          node tests/guard-lab.test.cjs
          node --check worker.js

      - name: Test regresji Centrum błędów RX
        run: |
          node --check guard-chat.js
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const js=fs.readFileSync('guard-chat.js','utf8');
          const html=fs.readFileSync('guard-lab.html','utf8');
          for(const marker of [
            'function renderHealth()',
            'Kolejka diagnostyczna',
            'Propozycje napraw RX',
            'Przetestuj 3 wtyczki',
            'Kopiuj raport błędów',
            'lines.join(String.fromCharCode(10))',
            'finally{renderHealth();}'
          ])assert.ok(js.includes(marker),'Missing RX diagnostic feature: '+marker);
          assert.ok(html.includes('id="guardRxHealth"'),'Missing RX diagnostic panel');
          console.log('PASS: RX diagnostics structure, copy formatting and refresh');
          NODE

      - name: Test regresji pustych wynikow RX
        run: node tests/guard-rx-empty-result-regression.test.cjs

      - name: Test trzech wtyczek RX Strażak
        run: node tests/guard-rx-plugin-health.test.cjs

      - name: Diagnostyka modułów Strażaka
        run: |
          node - <<'NODE'
          const {createRegistry}=require('./guard/plugin-core.cjs');
          const registry=createRegistry();
          registry.register({id:'health-check',description:'Local self-test',permissions:['read:status'],run:async()=>({message:'OK'})});
          (async()=>{
            await registry.execute('health-check',{task:'self-test'},true);
            const reports=registry.diagnostics();
            if(reports.length!==1||reports[0].status!=='ok'||reports[0].checks!==1)throw Error('Plugin diagnostics failed');
            console.log('RX plugin diagnostics: PASS');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Strazak Developer — bezpieczny skan repozytorium
        run: |
          node guard/repository-scan.cjs
          node guard/repository-summary.cjs
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('guard-developer-summary.json','utf8'));fs.writeFileSync('public/rx-fix-guidance.json',JSON.stringify({version:1,generatedAt:new Date().toISOString(),scanStatus:r.scanStatus,severity:r.severity,filesScanned:r.filesScanned,filesSkipped:r.filesSkipped,fileFixSuggestions:r.fileFixSuggestions})+'\\n')"
          node guard/developer-changes.cjs
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('guard-developer-changes.json','utf8'));fs.writeFileSync('public/guard-changes-summary.json',JSON.stringify({status:r.status,changedFiles:r.changedFiles,summary:r.summary})+'\\n')"

      - name: Zapisz raport Strazaka jako artefakt GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: guard-developer-report
          path: |
            guard-developer-report.json
            guard-developer-summary.json
            guard-developer-changes.json
          retention-days: 7
          if-no-files-found: error

      - name: Sprawdź dostęp Cloudflare przed publikacją
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" || { echo "::error::Brak sekretu Cloudflare token/account"; exit 1; }
          code="$(curl -sS --retry 2 --max-time 20 -o /tmp/rx-cf-token.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          node - "$code" <<'NODE'
          const fs=require('node:fs');
          const code=process.argv[2];
          const body=JSON.parse(fs.readFileSync('/tmp/rx-cf-token.json','utf8'));
          if(code!=='200'||body.success!==true||body.result?.status!=='active'){
            console.error('::error::Cloudflare token verification failed (HTTP '+code+'); check token status and permissions.');
            process.exit(1);
          }
          console.log('Cloudflare token active; verifying asset-upload authorization at deploy time.');
          NODE

      - name: Sprawdź dostęp do listy Workers
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 2 --max-time 20 -o /tmp/rx-cf-worker.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts")"
          node - "$code" <<'NODE'
          const fs=require('node:fs');
          const code=process.argv[2];
          const body=JSON.parse(fs.readFileSync('/tmp/rx-cf-worker.json','utf8'));
          if(code!=='200'||body.success!==true){
            console.error('::error::Workers list API denied (HTTP '+code+')');
            process.exit(1);
          }
          console.log('Workers list API read access OK');
          NODE

      - name: Diagnostyka konfiguracji pamięci RX CLOUD (bez sekretów)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Inspect only metadata. Never print variable values or secret contents.
          code="$(curl -sS --retry 2 --max-time 20 -o /tmp/rx-cloud-vars-meta.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/vexorio/settings")"
          node - "$code" <<'NODE'
          const fs=require('node:fs');
          const code=process.argv[2];
          if(code!=='200'){
            console.log('RX CLOUD config: cannot inspect Worker settings (HTTP '+code+'); manual dashboard check required.');
            process.exit(0);
          }
          let body;
          try{body=JSON.parse(fs.readFileSync('/tmp/rx-cloud-vars-meta.json','utf8'));}catch{console.log('RX CLOUD config: settings response unreadable.');process.exit(0);}
          if(body.success!==true){console.log('RX CLOUD config: settings API unavailable.');process.exit(0);}
          const bindings=body.result?.bindings||[];
          for(const name of ['RX_CLOUD_LEARNING_URL','RX_QUEEN_LOCAL_TOKEN']){
            const item=bindings.find(b=>b.name===name);
            console.log('RX CLOUD config '+name+': '+(item?'binding present ('+String(item.type||'unknown')+')':'binding missing'));
          }
          NODE

      - name: Publikuj w Cloudflare
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.152.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Sprawdz publiczny panel Guard
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then DEPLOY_URL="https://vexorio.grzegorzbub1985.workers.dev"; fi
          DEPLOY_URL="${DEPLOY_URL%/}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "$DEPLOY_URL/guard-lab.html?release=${GITHUB_SHA}" -o /tmp/vexorio-guard-lab.html &&
               curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "$DEPLOY_URL/guard-lab.js?release=${GITHUB_SHA}" -o /tmp/vexorio-guard-lab.js &&
               grep -q 'VEXORIO Guard' /tmp/vexorio-guard-lab.html &&
               grep -q 'credential_request' /tmp/vexorio-guard-lab.js; then
              echo 'PASS: Guard lab HTML and JavaScript available on Cloudflare'
              exit 0
            fi
            echo "Guard lab unavailable, attempt $attempt/5"
            sleep 5
          done
          echo 'FAIL: Guard lab is not published; inspect Cloudflare deployment and asset routing'
          exit 1

      - name: Sprawdz RX Centrum na Cloudflare
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then DEPLOY_URL="https://vexorio.grzegorzbub1985.workers.dev"; fi
          DEPLOY_URL="${DEPLOY_URL%/}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "$DEPLOY_URL/rx-center.html?release=${GITHUB_SHA}" -o /tmp/vexorio-rx-center.html &&
               grep -q 'RX Centrum' /tmp/vexorio-rx-center.html &&
               grep -q '/guard-lab.html' /tmp/vexorio-rx-center.html &&
               grep -q '/rx-bibi-manager.html' /tmp/vexorio-rx-center.html &&
               grep -q '/rx-bibi-studio.html' /tmp/vexorio-rx-center.html &&
               grep -q '/rx-admin-prototype.html' /tmp/vexorio-rx-center.html; then
              echo 'PASS: RX Centrum and navigation are published'
              exit 0
            fi
            echo "RX Centrum unavailable, attempt $attempt/5"
            sleep 5
          done
          echo 'FAIL: RX Centrum missing from Cloudflare deployment'
          exit 1

      - name: Sprawdz opublikowana wersje
        run: |
          test -s public/guard-lab.html
          test -s public/guard-lab.js
          test -s public/guard-install.js
          test -s public/guard-manifest.webmanifest
          grep -q 'VEXORIO Guard' public/guard-lab.html
          test -f public/index.html
          test -s public/push-sw.js
          test -s public/robots.txt
          test -s public/_headers
          grep -q 'function listingRiskSignals' public/index.html
          grep -q 'riskSignals=listingRiskSignals' public/index.html
          grep -q 'row.append(warning)' public/index.html
          grep -q 'Wysłać mimo ostrzeżenia' public/index.html
          echo "PASS: ostrzezenia przed oszustwami sa w paczce publikacyjnej"

      - name: Sprawdz publiczna strone HTTPS
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          # Wrangler may deploy successfully without exposing deployment-url output.
          # Verify the configured public Workers address instead of failing on empty output.
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://vexorio.grzegorzbub1985.workers.dev"
            echo "Wrangler did not expose deployment URL; verifying configured Workers address."
          fi
          case "$DEPLOY_URL" in
            https://*.workers.dev|https://*.workers.dev/) ;;
            *) echo 'Unexpected deployment URL'; exit 1 ;;
          esac
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "$DEPLOY_URL?deploy_check=${GITHUB_SHA}" -o /tmp/vexorio-production.html; then
              if ! curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "$DEPLOY_URL/robots.txt" | grep -Fq 'User-agent: *'; then
                echo 'robots.txt is missing on the deployed website'; sleep 5; continue
              fi
              if ! curl --fail --silent --show-error --location --max-time 15 "$DEPLOY_URL/guard/rx-developer-core-browser.js" | grep -Fq 'window.RXDeveloperCore'; then
                echo 'RX Developer Core browser adapter missing from deployed assets'; sleep 5; continue
              fi
              # Five public SEO / delivery regression checks before announcing a successful release.
              if curl --fail --silent --show-error --location --max-time 15 "$DEPLOY_URL/robots.txt" | grep -Eiq 'sitemap:|grzegorzbub1985|workers\\.dev'; then
                echo 'robots.txt must not publish a temporary domain or sitemap'; sleep 5; continue
              fi
              if ! curl --fail --silent --show-error --location --max-time 15 -D /tmp/vexorio-push-headers.txt -o /tmp/vexorio-push.js "$DEPLOY_URL/push-sw.js" || ! grep -Eiq '^content-type: *(application|text)/javascript' /tmp/vexorio-push-headers.txt; then
                echo 'Push service worker missing or wrong JavaScript content type'; sleep 5; continue
              fi
              if ! grep -Fq "name=\"vexorio-deploy-sha\" content=\"${GITHUB_SHA}\"" /tmp/vexorio-production.html; then
                echo 'Cloudflare is serving an older revision than the current GitHub commit'; sleep 5; continue
              fi
              if ! grep -q 'VEXORIO' /tmp/vexorio-production.html; then
                echo 'Public homepage branding is missing'; sleep 5; continue
              fi
              if ! curl --fail --silent --show-error --location --max-time 15 -D /tmp/vexorio-robots-headers.txt -o /dev/null "$DEPLOY_URL/robots.txt" || ! grep -Eiq '^content-type: *text/plain' /tmp/vexorio-robots-headers.txt; then
                echo 'robots.txt missing or wrong content type'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-content-type-options: *nosniff' /tmp/vexorio-robots-headers.txt; then
                echo 'Security headers must also cover robots.txt'; sleep 5; continue
              fi
              if ! curl --fail --silent --show-error --location --max-time 15 -D /tmp/vexorio-headers.txt -o /dev/null "$DEPLOY_URL/"; then
                echo 'Unable to read live security headers'; sleep 5; continue
              fi
              if ! grep -Eiq '^strict-transport-security: *max-age=31536000' /tmp/vexorio-headers.txt; then
                echo 'HSTS is missing from public homepage'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-download-options: *noopen' /tmp/vexorio-headers.txt; then
                echo 'Download hardening header is missing'; sleep 5; continue
              fi
              if ! grep -Eiq '^strict-transport-security: *max-age=31536000' /tmp/vexorio-robots-headers.txt; then
                echo 'HSTS is missing from robots.txt'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-content-type-options: *nosniff' /tmp/vexorio-push-headers.txt; then
                echo 'Push worker security headers are missing'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-download-options: *noopen' /tmp/vexorio-push-headers.txt; then
                echo 'Push worker download hardening header is missing'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-content-type-options: *nosniff' /tmp/vexorio-headers.txt || ! grep -Eiq '^x-frame-options: *DENY' /tmp/vexorio-headers.txt || ! grep -Eiq '^referrer-policy: *strict-origin-when-cross-origin' /tmp/vexorio-headers.txt || ! grep -Eiq '^permissions-policy: *camera=\(\), *microphone=\(\), *geolocation=\(\)' /tmp/vexorio-headers.txt || ! grep -Eiq '^x-permitted-cross-domain-policies: *none' /tmp/vexorio-headers.txt; then
                echo 'Live site is missing required browser security headers (check Cloudflare Workers static asset headers)'; cat /tmp/vexorio-headers.txt; sleep 5; continue
              fi
