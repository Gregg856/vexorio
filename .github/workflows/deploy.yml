name: Deploy VEXORIO

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent an older deployment from overwriting a newer revision.
concurrency:
  group: vexorio-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki
        uses: actions/checkout@v4

      - name: Przygotuj strone
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp guard-lab.html public/guard-lab.html
          cp guard-lab.js public/guard-lab.js
          cp guard-install.js public/guard-install.js
          cp guard-chat.js guard-commands.js guard-task-queue.js guard-engine-2.js guard-capabilities.js guard-icon.svg public/
          cp guard/plugin-core.cjs public/guard-plugin-core.js
          cp guard-task-analyzer-plugin.js public/guard-task-analyzer-plugin.js
          cp guard-manifest.webmanifest public/guard-manifest.webmanifest
          # Embed the exact GitHub revision in the deployed HTML for release verification.
          sed -i "s#</head>#<meta name=\"vexorio-deploy-sha\" content=\"${GITHUB_SHA}\"></head>#" public/index.html
          cp push-sw.js public/push-sw.js
          cp manifest.webmanifest public/manifest.webmanifest
          cp vexorio-app-icon.svg public/vexorio-app-icon.svg
          cp robots.txt public/robots.txt
          cp _headers public/_headers
          cat > wrangler.toml <<'EOF'
          name = "vexorio"
          compatibility_date = "2026-10-20"
          workers_dev = true

          main = "./worker.js"

          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = true

          [vars]
          VIEW_COUNT_ENABLED = "false"
          EOF

      - name: Sprawdz skladnie JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
          for (const [i, script] of scripts.entries()) new vm.Script(script, {filename: `inline-${i+1}.js`});
          for (const id of ['query', 'searchBtn', 'cards', 'myConversations']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing control: ${id}`);
          }
          console.log('PASS: syntax and essential controls');
          NODE

      - name: Sprawdz funkcje logowania, ogloszen i czatu
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const checks = [
            ['Logowanie Supabase', /sb\.auth\.(signInWithPassword|signInWithOAuth)/],
            ['Pobieranie ogloszen', /\.from\(['"]listings['"]\)/],
            ['Wiadomosci', /\.from\(['"]messages['"]\)/],
            ['Rozmowy', /\.from\(['"]conversations['"]\)/],
            ['Formularz ogloszenia', /id=["']addBtn["']/],
            ['Lista rozmow', /id=["']myConversations["']/],
          ];
          for (const [label, pattern] of checks) {
            if (!pattern.test(html)) throw new Error('Missing feature: ' + label);
            console.log('PASS: ' + label);
          }
          NODE

      - name: Testy regresji wyszukiwarki i odleglosci
        run: |
          node tests/search-location-regression.test.js
          node tests/location-radius-fixtures.test.js
          node tests/public-profile-regression.test.js
          node tests/mobile-filter-baseline.test.js
          node tests/prelaunch-critical-paths.test.js
          node tests/production-release-gate.test.js
          node tests/push-service-worker.test.cjs
          node tests/view-endpoint-regression.test.cjs
          node tests/view-endpoint-runtime.test.cjs
          node tests/guard-fraud-explain.test.cjs
          node tests/guard-report.test.cjs
          node tests/guard-review-priority.test.cjs
          node tests/guard-metrics-summary.test.cjs
          node tests/guard-chat.test.cjs
          node tests/guard-task-queue.test.cjs
          node tests/guard-engine-2.test.cjs
          node tests/guard-capabilities.test.cjs
          node tests/guard-ai-core.test.cjs
          node tests/guard-plugin-core.test.cjs
          node tests/guard-task-analyzer-plugin.test.cjs
          node tests/guard-engine.test.cjs
          node tests/guard-duplicates.test.cjs
          node tests/guard-images.test.cjs
          node tests/guard-image-features.test.cjs
          node tests/guard-pixel-features.test.cjs
          node tests/guard-image-model.test.cjs
          node tests/guard-spatial-features.test.cjs
          node tests/guard-combined-image-model.test.cjs
          node tests/guard-image-evaluation.test.cjs
          node tests/guard-image-similarity.test.cjs
          node tests/guard-image-pipeline.test.cjs
          node tests/guard-evaluate.test.cjs
          node tests/guard-model-adapter.test.cjs
          node tests/guard-local-model.test.cjs
          node tests/guard-local-integration.test.cjs
          node tests/guard-metrics.test.cjs
          node tests/guard-dataset-check.test.cjs
          node tests/guard-lab.test.cjs
          node --check worker.js

      - name: Publikuj w Cloudflare
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.152.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Sprawdz publiczny panel Guard
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then DEPLOY_URL="https://vexorio.grzegorzbub1985.workers.dev"; fi
          DEPLOY_URL="${DEPLOY_URL%/}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "$DEPLOY_URL/guard-lab.html?release=${GITHUB_SHA}" -o /tmp/vexorio-guard-lab.html &&
               curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "$DEPLOY_URL/guard-lab.js?release=${GITHUB_SHA}" -o /tmp/vexorio-guard-lab.js &&
               grep -q 'VEXORIO Guard' /tmp/vexorio-guard-lab.html &&
               grep -q 'credential_request' /tmp/vexorio-guard-lab.js; then
              echo 'PASS: Guard lab HTML and JavaScript available on Cloudflare'
              exit 0
            fi
            echo "Guard lab unavailable, attempt $attempt/5"
            sleep 5
          done
          echo 'FAIL: Guard lab is not published; inspect Cloudflare deployment and asset routing'
          exit 1

      - name: Sprawdz opublikowana wersje
        run: |
          test -s public/guard-lab.html
          test -s public/guard-lab.js
          test -s public/guard-install.js
          test -s public/guard-manifest.webmanifest
          grep -q 'VEXORIO Guard' public/guard-lab.html
          test -f public/index.html
          test -s public/push-sw.js
          test -s public/robots.txt
          test -s public/_headers
          grep -q 'function listingRiskSignals' public/index.html
          grep -q 'riskSignals=listingRiskSignals' public/index.html
          grep -q 'row.append(warning)' public/index.html
          grep -q 'Wysłać mimo ostrzeżenia' public/index.html
          echo "PASS: ostrzezenia przed oszustwami sa w paczce publikacyjnej"

      - name: Sprawdz publiczna strone HTTPS
        env:
          DEPLOY_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          # Wrangler may deploy successfully without exposing deployment-url output.
          # Verify the configured public Workers address instead of failing on empty output.
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://vexorio.grzegorzbub1985.workers.dev"
            echo "Wrangler did not expose deployment URL; verifying configured Workers address."
          fi
          case "$DEPLOY_URL" in
            https://*.workers.dev|https://*.workers.dev/) ;;
            *) echo 'Unexpected deployment URL'; exit 1 ;;
          esac
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "$DEPLOY_URL?deploy_check=${GITHUB_SHA}" -o /tmp/vexorio-production.html; then
              if ! curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "$DEPLOY_URL/robots.txt" | grep -Fq 'User-agent: *'; then
                echo 'robots.txt is missing on the deployed website'; sleep 5; continue
              fi
              # Five public SEO / delivery regression checks before announcing a successful release.
              if curl --fail --silent --show-error --location --max-time 15 "$DEPLOY_URL/robots.txt" | grep -Eiq 'sitemap:|grzegorzbub1985|workers\\.dev'; then
                echo 'robots.txt must not publish a temporary domain or sitemap'; sleep 5; continue
              fi
              if ! curl --fail --silent --show-error --location --max-time 15 -D /tmp/vexorio-push-headers.txt -o /tmp/vexorio-push.js "$DEPLOY_URL/push-sw.js" || ! grep -Eiq '^content-type: *(application|text)/javascript' /tmp/vexorio-push-headers.txt; then
                echo 'Push service worker missing or wrong JavaScript content type'; sleep 5; continue
              fi
              if ! grep -Fq "name=\"vexorio-deploy-sha\" content=\"${GITHUB_SHA}\"" /tmp/vexorio-production.html; then
                echo 'Cloudflare is serving an older revision than the current GitHub commit'; sleep 5; continue
              fi
              if ! grep -q 'VEXORIO' /tmp/vexorio-production.html; then
                echo 'Public homepage branding is missing'; sleep 5; continue
              fi
              if ! curl --fail --silent --show-error --location --max-time 15 -D /tmp/vexorio-robots-headers.txt -o /dev/null "$DEPLOY_URL/robots.txt" || ! grep -Eiq '^content-type: *text/plain' /tmp/vexorio-robots-headers.txt; then
                echo 'robots.txt missing or wrong content type'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-content-type-options: *nosniff' /tmp/vexorio-robots-headers.txt; then
                echo 'Security headers must also cover robots.txt'; sleep 5; continue
              fi
              if ! curl --fail --silent --show-error --location --max-time 15 -D /tmp/vexorio-headers.txt -o /dev/null "$DEPLOY_URL/"; then
                echo 'Unable to read live security headers'; sleep 5; continue
              fi
              if ! grep -Eiq '^strict-transport-security: *max-age=31536000' /tmp/vexorio-headers.txt; then
                echo 'HSTS is missing from public homepage'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-download-options: *noopen' /tmp/vexorio-headers.txt; then
                echo 'Download hardening header is missing'; sleep 5; continue
              fi
              if ! grep -Eiq '^strict-transport-security: *max-age=31536000' /tmp/vexorio-robots-headers.txt; then
                echo 'HSTS is missing from robots.txt'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-content-type-options: *nosniff' /tmp/vexorio-push-headers.txt; then
                echo 'Push worker security headers are missing'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-download-options: *noopen' /tmp/vexorio-push-headers.txt; then
                echo 'Push worker download hardening header is missing'; sleep 5; continue
              fi
              if ! grep -Eiq '^x-content-type-options: *nosniff' /tmp/vexorio-headers.txt || ! grep -Eiq '^x-frame-options: *DENY' /tmp/vexorio-headers.txt || ! grep -Eiq '^referrer-policy: *strict-origin-when-cross-origin' /tmp/vexorio-headers.txt || ! grep -Eiq '^permissions-policy: *camera=\(\), *microphone=\(\), *geolocation=\(\)' /tmp/vexorio-headers.txt || ! grep -Eiq '^x-permitted-cross-domain-policies: *none' /tmp/vexorio-headers.txt; then
                echo 'Live site is missing required browser security headers (check Cloudflare Workers static asset headers)'; cat /tmp/vexorio-headers.txt; sleep 5; continue
              fi
              if grep -q 'VEXORIO' /tmp/vexorio-production.html && grep -q 'id="query"' /tmp/vexorio-production.html && grep -q 'function listingRiskSignals' /tmp/vexorio-production.html && grep -q 'Wysłać mimo ostrzeżenia' /tmp/vexorio-production.html && grep -q 'row.append(warning)' /tmp/vexorio-production.html && grep -Fq "filtered.length===1?' listing'" /tmp/vexorio-production.html && grep -Fq 'const code=cityCountries.get(key)' /tmp/vexorio-production.html && grep -Fq 'object-fit:cover!important;object-position:center 25%!important' /tmp/vexorio-production.html && grep -Fq "for(const id of ['accountBtn','vexMobileChat'])" /tmp/vexorio-production.html && grep -Fq "'vexHeaderInboxCount'" /tmp/vexorio-production.html; then
                echo "PASS: public VEXORIO is reachable at $DEPLOY_URL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Public production smoke test failed: inspect HTTPS response, deployed content and browser security headers'
          exit 1
