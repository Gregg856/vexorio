name: RX BIBI Unified Adapter — isolated CI
on:
  pull_request:
    paths:
      - 'rx-bibi-unified-adapter.cjs'
      - 'tests/rx-bibi-unified-adapter.cjs'
      - 'tests/rx-bibi-extra.cjs'
      - 'tests/verify-real-dependencies.cjs'
      - '.github/workflows/rx-bibi-unified.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real dependencies
        run: node tests/verify-real-dependencies.cjs
      - name: Check syntax
        run: |
          node --check rx-bibi-unified-adapter.cjs
          node --check tests/rx-bibi-unified-adapter.cjs
          node --check tests/rx-bibi-extra.cjs
      - name: Run read-only integration tests
        run: |
          node tests/rx-bibi-unified-adapter.cjs
          node tests/rx-bibi-extra.cjs
