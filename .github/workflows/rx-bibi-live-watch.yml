name: RX BIBI — stały strażnik panelu
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rx-bibi-live-watch.yml'
      - 'tests/rx-queen-dialogue-watch.cjs'
      - 'tests/rx-live-panel.cjs'
      - 'tests/rx-bibi-browser-agent.cjs'
      - 'tests/rx-visual-audit.cjs'
      - 'tests/rx-screen-recorder.cjs'
      - 'rx-admin-prototype.html'
      - 'tests/rx-alarm-simulation.cjs'
      - 'scripts/check-rx-admin-ui.cjs'
      - 'rx-bibi-unified-adapter.cjs'
      - 'tests/rx-bibi-unified-adapter.cjs'
      - 'tests/rx-bibi-extra.cjs'
      - 'tests/rx-unified-failure-simulation.cjs'
      - 'tests/rx-bibi-dashboard-summary.cjs'
      - 'rx-chat-planner.mjs'
      - 'tests/rx-chat-panel-contract.cjs'
      - 'worker.js'
      - 'rx-developer-review-runner.cjs'
      - 'rx-queen-bibi-triage.cjs'
      - 'rx-command-bridge.cjs'
      - 'rx-task-catalog.cjs'
      - 'rx-ai-router.cjs'
      - 'tests/rx-developer-bridge-isolated.cjs'
      - 'guard-lab.html'
      - 'guard-tabs.js'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: rx-bibi-live-watch
  cancel-in-progress: false
jobs:
  live:
    name: RX BIBI — kontrola na żywo
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zainstaluj bibliotekę dla naszego RX BIBI
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: RX BIBI CENTRAL — struktura RX Admin i bezpieczeństwo
        run: node --test scripts/check-rx-admin-ui.cjs
      - name: RX BIBI CENTRAL — Unified Adapter i integracje
        run: |
          node tests/verify-real-dependencies.cjs
          node tests/rx-bibi-unified-adapter.cjs
          node tests/rx-bibi-extra.cjs
          node tests/rx-unified-failure-simulation.cjs
      - name: RX BIBI CENTRAL — raport zbiorczy
        run: node tests/rx-bibi-dashboard-summary.cjs
      - name: RX ALARM — sprawdź symulację awarii i deduplikację zgłoszeń
        run: node --test tests/rx-alarm-simulation.cjs
      - name: RX BIBI — otwórz prawdziwy panel na telefonie i komputerze
        id: check
        continue-on-error: true
        run: node tests/rx-live-panel.cjs
      - name: RX BIBI UNIFIED — audyt wizualny i zrzuty ekranu
        id: visual
        continue-on-error: true
        run: node tests/rx-visual-audit.cjs
      - name: RX BIBI UNIFIED — test nagrywania i zgód na ekran
        id: recorder
        continue-on-error: true
        run: node tests/rx-screen-recorder.cjs
      - name: RX BIBI Browser Agent 1.0 — obserwacja stron i nagrania
        id: browser_agent
        continue-on-error: true
        run: node tests/rx-bibi-browser-agent.cjs
      - name: RX BIBI — sprawdź połączenie czatu z RX Developerem
        run: node tests/rx-chat-panel-contract.cjs
      - name: RX BIBI — test pamięci Królowej i budowania przez mrówki
        run: |
          node tests/rx-developer-bridge-isolated.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {planCommand}=require('./rx-command-bridge.cjs');
          const {coordinateRX}=require('./rx-coordinator.cjs');
          const plan=planCommand('Zbuduj nowa funkcje',{energyBalance:100});
          assert.ok(plan.steps.some(x=>x.intent==='build_feature'&&x.supported));
          assert.equal(plan.autoExecuted,0);
          const coordinated=coordinateRX('Zbuduj nowa funkcje',{initialCredits:100});
          assert.ok(coordinated.ants.some(x=>x.intent==='build_feature'));
          assert.equal(coordinated.executed,0);
          assert.equal(coordinated.productionModified,false);
          console.log('PASS RX BIBI Queen build routing, ant planning, no production writes');
          NODE
      - name: RX BIBI — rozmawiaj testowo z lokalnym mózgiem Królowej
        id: dialogue
        continue-on-error: true
        run: node tests/rx-queen-dialogue-watch.cjs
      - name: RX Królowa — przeanalizuj raporty BIBI bez automatycznych poprawek
        id: triage
        if: always()
        run: node rx-queen-bibi-triage.cjs
      - name: RX Developer — analyze BIBI failure queue
        if: always()
        env:
          RX_TARGET: rx-developer-patch-bridge.cjs
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path='rx-bibi-reports/rx-queen-bibi-triage.json';
          if(!fs.existsSync(path)){console.log('BIBI triage unavailable');process.exit(0);}
          const triage=JSON.parse(fs.readFileSync(path,'utf8'));
          if(!Array.isArray(triage.nextWork)||triage.nextWork.length===0){console.log('No BIBI failures to analyze');process.exit(0);}
          const {spawnSync}=require('node:child_process');
          const allowed=new Set(['rx-command-bridge.cjs','rx-coordinator.cjs','rx-developer-patch-bridge.cjs']);
          const incident=triage.nextWork.find(item=>allowed.has(item.target)&&/^[a-f0-9]{16}$/.test(item.incidentId));
          if(!incident){console.log('No valid allowlisted BIBI incident to review');process.exit(0);}
          const result=spawnSync(process.execPath,['rx-developer-review-runner.cjs'],{stdio:'inherit',env:{...process.env,RX_TARGET:incident.target,RX_INCIDENT_ID:incident.incidentId},timeout:30000});
          if(result.error)throw result.error;
          if(result.status!==0)process.exit(result.status||1);
          console.log('RX Developer analyzed existing module; no code changes applied');
          NODE
      - name: RX BIBI SMART — odczytaj pamięć poprzedniego przebiegu
        id: previous
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          mkdir -p rx-bibi-reports/previous
          node -e '
          const fs=require("fs");
          const https=require("https");
          const api="https://api.github.com/repos/"+process.env.REPO;
          const get=url=>new Promise((resolve,reject)=>https.get(url,{headers:{"Authorization":"Bearer "+process.env.GH_TOKEN,"Accept":"application/vnd.github+json","User-Agent":"rx-bibi-smart"}},r=>{let chunks=[];r.on("data",c=>chunks.push(c));r.on("end",()=>{if(r.statusCode!==200)return reject(Error("GitHub "+r.statusCode));resolve(JSON.parse(Buffer.concat(chunks).toString("utf8")));});}).on("error",reject));
          (async()=>{
            const runs=await get(api+"/actions/workflows/rx-bibi-live-watch.yml/runs?branch=main&status=success&per_page=10");
            const prev=(runs.workflow_runs||[]).find(x=>String(x.id)!==process.env.CURRENT_RUN);
            if(!prev)return;
            const artifacts=await get(api+"/actions/runs/"+prev.id+"/artifacts?per_page=30");
            const artifact=(artifacts.artifacts||[]).find(x=>x.name==="rx-bibi-live-watch"&&!x.expired);
            if(!artifact)return;
            fs.writeFileSync("rx-bibi-reports/previous/artifact-reference.json",JSON.stringify({runId:prev.id,artifactId:artifact.id,url:artifact.archive_download_url},null,2));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"run_id="+prev.id+"\\n");
          })().catch(e=>{console.log("Previous run lookup unavailable:",e.message);});
          '
      - name: RX BIBI SMART — pobierz poprzedni raport
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rx-bibi-live-watch
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: rx-bibi-previous
      - name: RX BIBI SMART — zbiorczy indeks wykonanych kontroli
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.check.outcome }}
          DIALOGUE_OUTCOME: ${{ steps.dialogue.outcome }}
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
        run: |
          mkdir -p rx-bibi-reports
          node -e '
          const fs=require("fs");
          const checks=[
            ["rx-admin-ui","RX ADMIN UI","scripts/check-rx-admin-ui.cjs"],
            ["rx-unified-adapter","RX Unified Adapter","tests/rx-bibi-unified-adapter.cjs"],
            ["rx-dashboard-summary","RX BIBI Dashboard","tests/rx-bibi-dashboard-summary.cjs"],
            ["rx-alarm","RX ALARM","tests/rx-alarm-simulation.cjs"],
            ["rx-live-panel","RX BIBI Android/Desktop", "rx-bibi-reports/rx-live-panel.json"],
            ["rx-queen-dialogue","RX Królowa Dialogue","tests/rx-queen-dialogue-watch.cjs"],
            ["rx-queen-triage","RX Królowa Triage","rx-queen-bibi-triage.cjs"]
          ];
          const status={ "rx-live-panel":process.env.LIVE_OUTCOME,"rx-queen-dialogue":process.env.DIALOGUE_OUTCOME,"rx-queen-triage":process.env.TRIAGE_OUTCOME };
          const items=checks.map(([id,name,source])=>({id,name,source,outcome:status[id]||"step-not-individually-tracked"}));
          const history=[];
          const livePath="rx-bibi-reports/rx-live-panel.json";
          if(fs.existsSync(livePath)){
            try{
              const live=JSON.parse(fs.readFileSync(livePath,"utf8"));
              for(const check of (Array.isArray(live.checks)?live.checks:[]).slice(0,150)){
                if(!check||typeof check.name!=="string")continue;
                history.push({tester:"rx-live-panel",check:check.name.slice(0,120),ok:check.ok===true,scope:typeof check.scope==="string"?check.scope.slice(0,120):"unspecified"});
              }
            }catch(error){history.push({tester:"rx-live-panel",check:"report-parse",ok:false,scope:"LOCAL_ARTIFACT",error:String(error.message).slice(0,120)});}
          }
          let previousRunId=null,previousHistory=[];
          const previousPath="rx-bibi-previous/rx-bibi-smart-memory.json";
          if(fs.existsSync(previousPath)){
            try{
              const prior=JSON.parse(fs.readFileSync(previousPath,"utf8"));
              if(prior.kind==="rx-bibi-smart-error-memory"&&Array.isArray(prior.history)){
                previousRunId=String(prior.runId||"").slice(0,30);
                previousHistory=prior.history.filter(x=>x&&typeof x.tester==="string"&&typeof x.check==="string"&&typeof x.ok==="boolean").slice(0,150);
              }
            }catch(error){console.log("Previous SMART report unreadable:",error.message);}
          }
          const priorFailures=new Set(previousHistory.filter(x=>!x.ok).map(x=>x.tester+":"+x.check));
          const recurringAcrossRuns=history.filter(x=>!x.ok&&priorFailures.has(x.tester+":"+x.check)).map(x=>({tester:x.tester,check:x.check,previousRunId}));
          const failures=history.filter(x=>!x.ok);
          const recurring=Object.values(failures.reduce((acc,item)=>{const key=item.tester+":"+item.check;const prev=acc[key];acc[key]={tester:item.tester,check:item.check,count:(prev?.count||0)+1};return acc;},{}));
          const memory={schema:1,kind:"rx-bibi-smart-error-memory",runId:process.env.GITHUB_RUN_ID,scope:previousRunId?"CURRENT_AND_PREVIOUS_SUCCESSFUL_RUN":"CURRENT_RUN_ONLY_PREVIOUS_UNAVAILABLE",previousRunId,history,failures,recurring,recurringAcrossRuns,productionModified:false};
          fs.writeFileSync("rx-bibi-reports/rx-bibi-smart-memory.json",JSON.stringify(memory,null,2)+"\\n");
          const out={schema:1,kind:"rx-bibi-smart-test-index",runId:process.env.GITHUB_RUN_ID,scope:"THIS_WORKFLOW_ONLY",productionModified:false,items};
          fs.writeFileSync("rx-bibi-reports/rx-bibi-smart-index.json",JSON.stringify(out,null,2)+"\\n");
          '
      - name: RX BIBI SMART — scal historię incydentów i analizę Królowej
        id: memory_merge
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const current='rx-bibi-reports/rx-bibi-smart-memory.json';
          const previous='rx-bibi-previous/rx-bibi-smart-memory.json';
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'));}catch{return {};}};
          const now=read(current),old=read(previous);
          const historical=Array.isArray(old.incidents)?old.incidents:[];
          const currentIncidents=Array.isArray(now.incidents)?now.incidents:[];
          const byId=new Map(historical.filter(x=>x&&x.id).map(x=>[x.id,x]));
          for(const item of currentIncidents){if(item&&item.id)byId.set(item.id,item);}
          now.incidents=[...byId.values()].slice(-300);
          fs.writeFileSync(current,JSON.stringify(now,null,2)+'\n');
          fs.writeFileSync('rx-bibi-reports/rx-bibi-incident-history.json',JSON.stringify({history:now.incidents},null,2)+'\n');
          NODE
          node rx-queen-bibi-triage.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const file='rx-bibi-reports/rx-bibi-smart-memory.json';
          const memory=JSON.parse(fs.readFileSync(file,'utf8'));
          const triage=JSON.parse(fs.readFileSync('rx-bibi-reports/rx-queen-bibi-triage.json','utf8'));
          memory.incidents=(triage.incidents||[]).map(item=>{
            const previous=Array.isArray(memory.incidents)?memory.incidents.find(x=>x.id===item.id):null;
            return previous?.developerReview&&!item.developerReview?{...item,developerReview:previous.developerReview}:item;
          });
          memory.developerHandoff=triage.developerHandoff||[];
          const reviewPath='rx-bibi-reports/rx-developer-review.json';
          if(fs.existsSync(reviewPath)){
            const review=JSON.parse(fs.readFileSync(reviewPath,'utf8'));
            const id=review.incidentId;
            const incident=memory.incidents.find(x=>x.id===id);
            if(!id||!incident)throw Error('RX Developer review has no matching BIBI incident');
            const candidates=Array.isArray(review.patchCandidates)?review.patchCandidates:[];
            if(candidates.some(x=>x.incidentId!==id))throw Error('RX Developer candidate incident mismatch');
            const evidence={incidentId:id,target:review.target||null,candidates:candidates.length,passed:candidates.filter(x=>x.functionalValidation==='passed').length,failed:candidates.filter(x=>x.functionalValidation==='failed'||x.bibiValidation==='failed').length,status:candidates.length?'CANDIDATES_CHECKED':'NO_PATCH_CANDIDATES',requiresApproval:true,changesApplied:false};
            incident.developerReview=evidence;
            memory.developerReviews=[evidence];
            fs.writeFileSync('rx-bibi-reports/rx-bibi-incident-history.json',JSON.stringify({history:memory.incidents},null,2)+'\n');
          }
          fs.writeFileSync(file,JSON.stringify(memory,null,2)+'\n');
          NODE
      - name: RX BIBI SMART — prześlij raport do prywatnej skrzynki RX CLOUD
        if: always()
        continue-on-error: true
        env:
          RX_CLOUD_INBOX_URL: ${{ secrets.RX_CLOUD_INBOX_URL }}
          RX_CLOUD_INBOX_TOKEN: ${{ secrets.RX_CLOUD_INBOX_TOKEN }}
        run: |
          node -e '
          const fs=require("fs");
          const url=process.env.RX_CLOUD_INBOX_URL||"";
          const token=process.env.RX_CLOUD_INBOX_TOKEN||"";
          if(!url||!token){console.log("RX CLOUD inbox not configured; artifact retained in GitHub Actions.");process.exit(0);}
          const parsed=new URL(url);
          if(parsed.protocol!=="https:"||parsed.username||parsed.password||parsed.search||parsed.hash||parsed.pathname!=="/__rxcloud/bibi/inbox")throw Error("Invalid private RX CLOUD inbox endpoint");
          const data=fs.readFileSync("rx-bibi-reports/rx-bibi-smart-memory.json");
          if(data.length>262144)throw Error("RX BIBI report exceeds cloud inbox limit");
          fetch(url,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:data,signal:AbortSignal.timeout(10000),redirect:"error"}).then(async r=>{
            if(!r.ok)throw Error("RX CLOUD inbox HTTP "+r.status);
            console.log("RX BIBI SMART report accepted by RX CLOUD inbox.");
          }).catch(e=>{console.error("RX CLOUD inbox delivery unavailable:",e.message);process.exitCode=1;});
          '
      - name: Zachowaj raport i zdjęcia także przy błędzie
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rx-bibi-live-watch
          path: rx-bibi-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Zgłoś awarię w GitHub Issues bez duplikatów
        if: steps.check.outcome == 'failure' || steps.dialogue.outcome == 'failure' || steps.browser_agent.outcome == 'failure' || steps.visual.outcome == 'failure' || steps.recorder.outcome == 'failure' || steps.triage.outcome == 'failure' || steps.memory_merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title='RX BIBI: panel lub rozmowa Królowej — awaria';
            const {owner,repo}=context.repo;
            const url='https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const body='Automatyczna kontrola RX BIBI wykryła problem panelu lub syntetycznej rozmowy Królowej. Raporty: '+url+'. Nie sprawdzano zalogowanego czatu ani nie zmieniano danych produkcyjnych.';
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            const found=issues.find(i=>!i.pull_request&&i.title===title);
            if(found) await github.rest.issues.createComment({owner,repo,issue_number:found.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
      - name: Podsumowanie
        if: always()
        env:
          RESULT: ${{ steps.check.outcome }}
          DIALOGUE: ${{ steps.dialogue.outcome }}
          BROWSER_AGENT: ${{ steps.browser_agent.outcome }}
          MEMORY_MERGE: ${{ steps.memory_merge.outcome }}
        run: |
          echo "## RX BIBI — centralny tester i strażnik panelu" >> "$GITHUB_STEP_SUMMARY"
          echo "- Panel produkcyjny: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Syntetyczne rozmowy Królowej: $DIALOGUE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser Agent: $BROWSER_AGENT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Historia błędów: $MEMORY_MERGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Zakres: prawdziwa publiczna brama RX ADMIN oraz syntetyczna rozmowa z lokalnym planerem Królowej" >> "$GITHUB_STEP_SUMMARY"
          echo "- Analiza Królowej: rx-queen-bibi-triage.json (propozycje, bez automatycznych poprawek)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Zalogowana rozmowa z Królową: nie jest objęta tym testem" >> "$GITHUB_STEP_SUMMARY"
          echo "- Raport JSON i zrzuty: artefakt rx-bibi-live-watch" >> "$GITHUB_STEP_SUMMARY"
      - name: Oznacz awarię testu
        if: steps.check.outcome == 'failure' || steps.dialogue.outcome == 'failure' || steps.browser_agent.outcome == 'failure' || steps.visual.outcome == 'failure' || steps.recorder.outcome == 'failure' || steps.triage.outcome == 'failure' || steps.memory_merge.outcome == 'failure'
        run: exit 1
