name: RX Queen staging smoke (isolated)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rx-queen-staging-smoke.yml'
permissions:
  contents: read
jobs:
  unauthenticated-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify staging gateway denies unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://owkjdlpawczrnwyszduj.supabase.co/functions/v1/rx-queen-private-queue'
          status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$endpoint")"
          if [ "$status" != 401 ]; then
            echo "::error::Expected 401, received $status"
            exit 1
          fi
          echo "### RX Queen staging smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- Anonymous request denied: HTTP 401" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authenticated admin read: NOT TESTED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: NOT CONTACTED" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify invalid bearer cannot read private tasks
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://owkjdlpawczrnwyszduj.supabase.co/functions/v1/rx-queen-private-queue'
          status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' --header 'Authorization: Bearer invalid-staging-smoke-token' "$endpoint")"
          if [ "$status" != 401 ]; then
            echo "::error::Expected 401 for invalid bearer, received $status"
            exit 1
          fi
          echo "- Invalid bearer denied: HTTP 401" >> "$GITHUB_STEP_SUMMARY"
