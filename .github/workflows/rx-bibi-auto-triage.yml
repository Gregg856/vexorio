name: RX BIBI Bot — automatic failure triage
on:
  workflow_run:
    workflows: ["RX BIBI Tester — mobile browser"]
    types: [completed]
permissions:
  actions: read
  issues: write
concurrency:
  group: rx-bibi-failure-triage
  cancel-in-progress: false
jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Analyze tester, classify failures, and maintain one issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const run=context.payload.workflow_run;
            // Never execute untrusted code from the tested workflow.
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner,repo,run_id:run.id,per_page:100});
            const failures=jobs.filter(j=>j.conclusion==='failure').map(j=>({
              job:j.name,
              steps:(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name),
              url:j.html_url
            }));
            const classify=f=>{
              const s=[f.job,...f.steps].join(' ').toLowerCase();
              if(/auth|login|logow|zalogowan|e2e/.test(s))return 'AUTH_E2E';
              if(/browser|mobile|chromium|playwright|panel/.test(s))return 'BROWSER_UI';
              if(/neural|brain|mózg|model|mrówk/.test(s))return 'MODEL';
              return 'OTHER';
            };
            const title='[RX BIBI BOT] Browser tester — recurring failure';
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            const existing=issues.find(i=>!i.pull_request&&i.title===title);
            if(run.conclusion==='success'){
              if(existing)await github.rest.issues.createComment({owner,repo,issue_number:existing.number,body:'Tester recovered: '+run.html_url+' — review before closing.'});
              core.info('RX BIBI Tester green: '+run.html_url);
              return;
            }
            const lines=[
              'Automatyczna diagnoza RX BIBI. Bot nie uruchamia kodu z raportu, nie zmienia sekretów ani produkcji.',
              '',
              'Przebieg: '+run.html_url,
              'Wynik: '+run.conclusion+' / #'+run.run_number,
              'Nieudane zadania:'
            ];
            for(const f of failures){
              const category=classify(f);
              lines.push('- ['+category+'] '+f.job+' / '+(f.steps.join(', ')||'unknown step')+' — '+f.url);
              if(category==='AUTH_E2E')lines.push('  - Sprawdź konto testowe oraz sekrety GitHub; nie publikuj haseł.');
              if(category==='BROWSER_UI')lines.push('  - Sprawdź zrzuty i logi Playwright w artefaktach testera.');
              if(category==='MODEL')lines.push('  - Powtórz lokalne testy regresji przed zmianą modelu.');
            }
            lines.push('','Testy lokalne i mock nie dowodzą zalogowanego czatu produkcyjnego.');
            const body=lines.join('\n');
            if(existing)await github.rest.issues.update({owner,repo,issue_number:existing.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
