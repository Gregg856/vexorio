name: RX Command Center — browser verification
on:
  push:
    branches: [rx/command-center-browser-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check guard-rx-live-command-center.js
      - run: node tests/guard-rx-command-center-integration.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - name: Chromium Command Center mount and refresh
        run: node tests/guard-rx-command-center-browser.cjs
