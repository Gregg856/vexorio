name: RX Queen — scheduled diagnostics
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RX Teacher - bounded automatic dialogue practice
        run: |
          node tests/rx-queen-dialogue-watch.cjs
          node tests/rx-chat-planner.mjs
      - name: Save RX Teacher lesson results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rx-teacher-lessons
          path: rx-bibi-reports/rx-queen-dialogue.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run bounded Queen diagnostics
        run: |
          node -e "const r=require('./rx-queen-diagnostics-report.cjs').queenDiagnosticsReport({approved:true,execute:true,maxChecks:3});console.log(JSON.stringify(r,null,2));if(r.failed)process.exitCode=1"
