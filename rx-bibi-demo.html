<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RX BIBI — DEMO</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06151a;color:#e8fff4;font:16px system-ui}main{max-width:720px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:14px}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #24644d;padding-bottom:12px}h1{font-size:1.3rem;margin:0;color:#52f6a6}a{color:#a1f5cd}.note{color:#acd1c1;font-size:.82rem}#messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px 0}.bubble{padding:12px 15px;border-radius:16px;background:#12303a;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere}.me{align-self:flex-end;background:#087b51}form{display:flex;gap:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}textarea{flex:1;min-width:0;min-height:52px;max-height:110px;resize:vertical;border:1px solid #31836b;border-radius:12px;background:#10272c;color:white;font:inherit;padding:12px}button{border:0;border-radius:12px;background:#17e27d;color:#06231b;font:inherit;font-weight:700;padding:10px}button:disabled{opacity:.5}</style></head>
<body><main><header><img src="/rx-bibi-mascot.svg" alt="" width="55" height="60"><div><h1>👑 BIBI — DEMO</h1><div class="note">Test bez logowania · tylko lokalny planer RX · bez prywatnej pamięci i zadań</div><a href="/rx-client">Wróć do BIBI z logowaniem</a></div><button type="button" id="reset">Nowa</button></header><div id="messages" aria-live="polite"></div><form id="form"><textarea id="message" maxlength="1000" placeholder="Napisz wiadomość…" aria-label="Wiadomość"></textarea><button id="send" type="submit">Wyślij</button></form><div id="status" class="note" role="status">Tryb demonstracyjny. Rozmowa nie jest zapisywana na serwerze.</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let history=[],busy=false;
function bubble(value,me){const e=document.createElement('div');e.className='bubble'+(me?' me':'');e.textContent=value;$('messages').append(e);e.scrollIntoView({block:'end'});}
$('reset').onclick=()=>{history=[];$('messages').replaceChildren();$('status').textContent='Nowa rozmowa demonstracyjna.';};
$('form').onsubmit=async event=>{event.preventDefault();const message=$('message').value.trim();if(!message||busy)return;busy=true;$('send').disabled=true;$('message').value='';bubble(message,true);$('status').textContent='BIBI odpowiada…';try{const response=await fetch('/api/rx/client/demo/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history:history.slice(-10)}),signal:AbortSignal.timeout(12000)});const data=await response.json();if(!response.ok||!data.ok||typeof data.answer!=='string')throw Error('Błąd serwera');bubble(data.answer);history.push(message,data.answer);history=history.slice(-10);$('status').textContent='Gotowe · demo bez logowania';}catch{bubble('Nie udało się uzyskać odpowiedzi. Spróbuj ponownie.');$('status').textContent='Błąd połączenia.';}finally{busy=false;$('send').disabled=false;}};
$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit();}};
</script></body></html>
