<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEXORIO STAGING — Moderacja</title><style>body{background:#081d30;color:#f5fbff;font:16px system-ui;margin:24px}button,input{font:inherit;padding:10px;margin:5px}dialog{background:#081d30;color:#fff;border:1px solid #36516a;border-radius:12px;max-width:850px;width:90%;max-height:85vh;overflow:auto}.notice{border:1px solid #36516a;border-radius:10px;padding:12px;margin:12px 0}.muted{color:#b4c6d0}.tools{display:flex;gap:8px}button{cursor:pointer;border-radius:8px}#pendingList p{overflow-wrap:anywhere}</style></head><body><h1>VEXORIO — STAGING</h1><p>Wyłącznie testowa kolejka moderacji. Nie używa bazy produkcyjnej.</p><p id="authStatus">Sprawdzanie sesji…</p><button id="login">Zaloguj e-mailem</button><button id="logout" hidden>Wyloguj</button><button id="openAdmin" hidden>Otwórz kolejkę</button><dialog id="adminDashboardDialog"><button onclick="document.getElementById('adminDashboardDialog').close()">× Zamknij</button><h2>Panel administratora STAGING</h2><div id="dashOverview"></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const stageUrl='https://owkjdlpawczrnwyszduj.supabase.co';
const stageKey='sb_publishable_ok5FaQ2s3HqMKZNQoBisRQ_we9Tiszs';
window.vexorioStagingSupabase=window.supabase.createClient(stageUrl,stageKey);
const client=window.vexorioStagingSupabase;
async function refresh(){const {data:{session}}=await client.auth.getSession();document.getElementById('authStatus').textContent=session?'Zalogowano: '+session.user.email:'Brak sesji STAGING';document.getElementById('logout').hidden=!session;document.getElementById('openAdmin').hidden=!session;document.getElementById('login').hidden=!!session}
document.getElementById('login').onclick=async()=>{const email=prompt('E-mail konta testowego STAGING:');if(!email)return;const {error}=await client.auth.signInWithOtp({email:email.trim(),options:{emailRedirectTo:location.href.split('#')[0]}});alert(error?error.message:'Sprawdź e-mail, aby zalogować się do STAGING.')};
document.getElementById('logout').onclick=async()=>{await client.auth.signOut();await refresh()};
document.getElementById('openAdmin').onclick=()=>document.getElementById('adminDashboardDialog').showModal();
client.auth.onAuthStateChange(()=>refresh());refresh();
</script><script src="./moderation-triage.js"></script><script src="./moderation-queue.js"></script></body></html>
